  {
    id:"santacatalina",
    name:"Monasterio Santa Catalina",
    alt:"Klosterstadt in Arequipa",
    meta:["Stadt in der Stadt","2.330 m","S/ 50 Erwachsene","Di und Mi bis 19 Uhr offen"],
    intro:[
      "Santa Catalina ist kein Kloster im Sinne eines einzelnen Kreuzgangs, sondern eine befestigte Kleinstadt aus über 20.000 Quadratmetern mitten in Arequipa: Straßen mit eigenen Namen, Gassen um Höfe, Waschplätze, Zellen mit privaten Küchen und reichlich eingerichteten Räumen. Gegründet 1579, bewohnt von Nonnen aus wohlhabenden spanischen Familien, blieb sie zwei Jahrhunderte ein geschlossener Kosmos mitten in der Stadt; ein Teil ist bis heute Klausur.",
      "Dieses Kapitel geht mit Ihnen durch die Besucherroute: vom Eingang an der Straße Santa Catalina über die farbigen Höfe und Gassen bis zur Kirche und den Wohnräumen. Wir lesen die Farben, die Türen, die Mitgiften der Nonnen und die Erdbeben der Jahre 1582 und der 1960er als Erzähllinien. Die Mauern in Ocker und Blau tragen die Bilder: Hier sehen Sie die Spannung von Gelübde und Lebensstandard nirgends so deutlich ausgeformt."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#e07a3f"/><rect x="40" y="40" width="640" height="320" fill="#f3d9a4" stroke="#8e5a2f" stroke-width="4"/><rect x="120" y="110" width="130" height="90" fill="#3f6b8f"/><text x="185" y="160" font-size="11" fill="#fff" text-anchor="middle">Claustro los Naranjos</text><rect x="330" y="90" width="120" height="80" fill="#b0413e"/><text x="390" y="135" font-size="11" fill="#fff" text-anchor="middle">Iglesia</text><rect x="500" y="110" width="130" height="90" fill="#5b6d8f"/><text x="565" y="160" font-size="11" fill="#fff" text-anchor="middle">Vocales</text><rect x="150" y="250" width="130" height="80" fill="#b0413e"/><text x="215" y="295" font-size="11" fill="#fff" text-anchor="middle">Cocina</text><rect x="480" y="250" width="150" height="80" fill="#3f6b8f"/><text x="555" y="295" font-size="11" fill="#fff" text-anchor="middle">Calle Cordoba</text><rect x="40" y="330" width="90" height="16" rx="4" fill="#3b4652"/><text x="85" y="343" font-size="11" fill="#fff" text-anchor="middle">Eingang</text><path d="M85,332 L120,300 L160,220 L250,180" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="8 6"/><g font-size="14" font-weight="bold"><circle cx="85" cy="338" r="11" fill="#3b3040"/><text x="85" y="342" fill="#fff" text-anchor="middle">1</text><circle cx="185" cy="155" r="11" fill="#3b3040"/><text x="185" y="159" fill="#fff" text-anchor="middle">2</text><circle cx="390" cy="170" r="11" fill="#3b3040"/><text x="390" y="174" fill="#fff" text-anchor="middle">3</text><circle cx="555" cy="290" r="11" fill="#3b3040"/><text x="555" y="294" fill="#fff" text-anchor="middle">4</text></g><g font-size="18" font-weight="bold" fill="#fff"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht maßstäblich: Die Klosterstadt liegt hinter einer Mauer mitten in Arequipa; die Route läuft als Schleife über Höfe und Gassen und führt zur Kirche und Ausgang zurück.",
    planStations:[
      ["Eingang und Kasse","Straße Santa Catalina 301, hier Ticket und Aushang zu Führungen."],
      ["Claustro los Naranjos","Einstiegshof mit Orangenbäumen, erster Blick in die Gebäudewelt."],
      ["Kirche, Zellen und Küche","Kirche, Wohnzellen, Küchen und Höfe der Nonnen."],
      ["Calle Cordoba und Ausgang","Straßenzug im Kloster, Rückweg zum Eingangsareal."]
    ],
    history:[
      ["Bauzeit und Vorgeschichte","Der Vizekönig Francisco de Toledo genehmigte die Gründung, 1579 unterzeichneten Stadtrat, Richter, Bürgermeister und Erzbistum den Gründungsvertrag; Doña Maria de Guzman, reiche Witwe, erklärte sich bereit, als erste Bewohnerin und Priorin einzutreten und ihren Besitz dem Kloster zu vermachen. 1580 wurden Kloster und Kirche geweiht. Dazu kam die sitte der Zeit, dass die zweite Tochter einer Familie ins Kloster einzutreten hatte, was reiche Familien zwischen religiösem Gebot und Standeslogik vermitteln ließ, und Santa Catalina nahm nur Kandidatinnen mit Vermögen."],
      ["Symbolik und Funktion","Santa Catalina war als Nonnengemeinschaft der Orden der hl. Katharina von Siena strukturell eine Enklave: eine Stadt mit eigenen Namen, eigenen Regeln und eigener Ökonomie innerhalb der Stadt. Als Mitgift für eine Chorschwester waren rund 2.400 Silbermünzen üblich, dazu Gemälde, Statuen und Einrichtung, und genau das erklärt die Ausstattung der Wohnzellen. Die Farben aus Ocker, Rostrot und Blau versteht man erst im Gang durch die Quartiere: Sie sind keine Dekoration, sondern Bezeichnungsraum, jeder Hof und jedes Quartier trägt eigenen Farbwert und eigene Funktion, mit Waschplätzen und Orangenhof."],
      ["Wandel und Gegenwart","Erdbeben 1582 und ab Mitte des 20. Jahrhunderts beschädigte die Anlage wiederholt; nach den Beben der 1960er wurde der größere Teil der Klausur 1970 für Besucher geöffnet. Bis heute leben etwa zwanzig Nonnen in einem abgeschlossenen Flügel; die Adresse ist ein Briefkasten, mehr wirkt der Ort nicht nach außen. Aktuelle Hausordnung: 9 bis 18 Uhr täglich, zuletzt Einlass 17 Uhr, Dienstag und Mittwoch verlängert bis 19 Uhr mit Einlass bis 18 Uhr; Eintritt S/ 50, Promotiontage zehn des Monats und letzter Sonntag zum reduzierten Preis."]
    ],
    stations:[
      ["Station 1, Eingang und Kasse","Der Eingang liegt an der Straße Santa Catalina 301, fünf Minuten von der Plaza de Armas, mit Kasse, Auflagen und Kontrolle. Kaufen Sie Tickets vorzugsweise online oder früh am Morgen, sonst stehen Feiertagsgruppen davor. Nach dem Eintritt gelangen Sie auf einen Hof mit Orangenhöfen, erster Blick in die Gebäudewelt. Audioführer sind vorhanden und sinnvoll; die Gassen sind labyrinthisch, und ohne Orientierung läuft man Wege doppelt. Halten Sie Ihr Ticket griffbereit, die Kontrolle erfolgt am Eintritt.","Santa_Catalina_Arequipa.jpg"],
      ["Station 2, Claustro und Höfe","Der nächste Abschnitt zeigt die Hofstruktur: Orangenhof mit Brunnen, dunkler Kreuzgang, der vom Kirchturm gespiegelt wird. Die Farbfläche wechselt pro Quartier; das Nachmittagslicht und die schlichte Silhouette wirken wie eine streng geplante Farbenpalette. Beobachten Sie die Steinmetzkraft: Sillar, der helle Vulkanstein Arequipas, ist auf den Türen und Fensterrahmen zugeschnitten; die Architektur trägt Mudéjar-Wurzeln in den Proportionen. Kombinieren Sie dieses Quartier mit dem Blick zurück Richtung Stadt, dann gehört die Dimensionslage dazu: Die Klosterstadt ist deutlich größer als ein Häuserblock.","Santa_Catalina_Cloister.jpg"],
      ["Station 3, Zellen und Küche","In diesem Quartier liegen die Wohnzellen, Küchen und Höfe der Nonnen. Was überrascht: Die Zellen waren keine Armutsräume. Gemälde, Möbel und Wäsche erzählen von Familien, die ihre Töchter mit Mitgiften versorgten; die Regel verlangte Armut, die Wirklichkeit zahlte. In der Küche stehen Kohleöfen: Die Schlote sind erhalten, Ruß schichtet sich an den Decken ab. Privates Bad und private Küche waren erlaubt; die Grenze zwischen Gelübde und Lebensstandard war verhandelt, nicht prinzipiell geschlossen.","Santa_Catalina_Cells.jpg"],
      ["Station 4, Calle Cordoba und Ausgang","Der letzte Abschnitt führt entlang der Calle Cordoba, ein Straßenzug mit Mauern, Fensterläden und ein paar Handwerksgängen. Hier wird deutlich, dass die Nonnen Stadt auf einer Stadt ihre Wege mit eigener Benennung belegt hatten. Über den Blick von der erhöhten Plattform sehen Sie die Vulkane von Arequipa, Misti und Chachani über die Dächer hinaus. Ein Blick auf die Uhr: Wer Dienstag oder Mittwoch kommt, sollte das Abendlicht ab 18 Uhr einplanen, denn dann leuchtet die Nachtfassung der Anlage wieder wie ein Farbfilm. Der Ausgang führt zurück zur Straße Santa Catalina.","Santa_Catalina_Calle.jpg"]
    ],
    praktisch:["Eintritt 2026: S/ 50 Erwachsene (national und ausländisch), S/ 30 Kinder von 7 bis 18, S/ 20 peruanische Studierende; Promotiontage: 10. des Monats und letzter Sonntag.","Öffnungszeiten: täglich 9 bis 18 Uhr, letzter Einlass 17 Uhr; Dienstag und Mittwoch verlängert bis 19 Uhr, letzter Einlass 18 Uhr.","Anfahrt: rund 5 Gehminuten von der Plaza de Armas, Adresse Santa Catalina 301.","Besuchsdauer: 1,5 bis 2 Stunden; ein Audioführer hilft, die Gassenplanerischen Verbindungen sind komplex.","Besuchstag: Dienstag oder Mittwoch abends rechnen: Der Abendlicht-Effekt der farbigen Mauern ist der beste Moment."],
    sources:["qphotels.com: Santa Catalina Horarios y Precios 2026","santacatalina.org.pe: aktuelle Tarife und Öffnungszeiten","de.wikipedia.org: Kloster Santa Catalina"]
  },
  {
    id:"ballestas",
    name:"Islas Ballestas",
    alt:"Wildlife vor Paracas",
    meta:["Bootstour ab El Chaco","SERNANP S/ 11","Besuch 6 bis 13 Uhr","Seeloewe, Pinguine, Guano"],
    intro:[
      "Die Ballestas-Inseln liegen vor der Küste von Paracas und werden mal Galapagos für Arme genannt, ein Name, der der Dichte der Tiere nicht gerecht wird. Von der kleinen Hafensiedlung El Chaco fahren offene Boote in rund 30 Minuten zu den Felsinseln, auf denen Zehntausende Seevoegel, Suedamerikanische Seeloewen und Humboldtpinguine auf schroffen Böden leben. Wichtig zur Einordnung: Der Ausflug ist eine Bootsrundfahrt, auf die Inseln gehen Sie nicht.",
      "Dieses Kapitel führt Sie von Tickets am Pier bis zur Rückkehr, über das El Candelabro, das Riesenmotiv im Sand der Halbinsel, das bereits vom Boot sichtbar ist. Wir klären die Preismechanik, die Wetterabhängigkeit und den Vorteil des fruehen Boots: Vor 8 Uhr ist das Meer am ruhigsten, das Licht besser, und die Vögel noch dicht an den Klippen. Nachmittagstouren werden oft abgebrochen; der Wind weitet die See rasch. Reservierte Tickets für den SERNANP-Eintritt sparen am Pier Zeit."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#7fb4c9"/><polygon points="0,400 200,300 420,400" fill="#d9c28f"/><text x="180" y="380" font-size="11" fill="#5a4a26">Halbinsel Paracas</text><polygon points="500,150 660,180 640,120 560,105" fill="#a8967d" stroke="#8e7d64" stroke-width="2"/><text x="600" y="140" font-size="11" fill="#fff">Ballestas</text><rect x="120" y="330" width="70" height="16" rx="4" fill="#3b4652"/><text x="155" y="342" font-size="11" fill="#fff" text-anchor="middle">El Chaco</text><path d="M160,330 L340,280 L520,190" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="8 6"/><g font-size="14" font-weight="bold"><circle cx="160" cy="338" r="11" fill="#3b4652"/><text x="160" y="342" fill="#fff" text-anchor="middle">1</text><circle cx="380" cy="270" r="11" fill="#3b4652"/><text x="380" y="274" fill="#fff" text-anchor="middle">2</text><circle cx="590" cy="160" r="11" fill="#3b4652"/><text x="590" y="164" fill="#fff" text-anchor="middle">3</text></g><g font-size="18" font-weight="bold" fill="#fff"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht maßstäblich: Abfahrt am Hafen El Chaco, vorbei am Candelabro an der Küste zur Inselgruppe; die Route bleibt abhängig von Wind und Bootskapitaen.",
    planStations:[
      ["Hafen El Chaco","Ticketkontrolle von SERNANP und Bootsabfahrt."],
      ["El Candelabro","Bootsstopp am Kuestengeoglyph der Halbinsel Paracas."],
      ["Ballestas-Inseln","Rundfahrt an den Felswaenden mit Seevoegeln und Seeloewen."]
    ],
    history:[
      ["Bauzeit und Vorgeschichte","Der Reichtum vor Paracas ist der Humboldt-Strom: Kalte Auftriebwasser bringen Naehrstoffe nach oben, was Vogelkolonien in Zehntausenden ernährte; deren Guano haufte sich über Jahrhunderte zu meterdicken Schichten. Im 19. Jahrhundert wurde der Guano zur wichtigsten Exportware Perus, fuellte den Staatshaushalt und wurde unter harten Bedingungen abgebaut, zeitweise von Zwangsarbeitern aus China auf den Inseln. Die Archäologie der Paracas-Kultur, bekannt fuer praechtige Gewebe, liegt in derselben Kuestenebene, nur wenig landeinwärts."],
      ["Symbolik und Funktion","Meterdicke Guanoschichten machten die Inseln zum Goldesel des Landes, heute sind sie geschuetztes Naturreservat. Das El Candelabro, der Riss am Sand der Halbinsel, trägt eine ganze Spekulationen: Seemannssymbol, Lichtzeichen oder Kalendermarkierung; gesichert ist nur, dass es mindestens 200 Jahre alt und nur vom Wasser aus sichtbar ist: Von Land bleibt es flach und nicht lesbar. Die Tierliste reicht Guanascharben, Tölpeln, Möwen und der Humboldtpinguin, ausgerechnet hier, am kalten Strom, und die Seelöwen lagern in den unteren Felsbereichen."],
      ["Wandel und Gegenwart","Heute liegt die Inselgruppe im Reserva Nacional Paracas, verwaltet von SERNANP, Besuchsfenster liegt verreinbart bei 6 bis 13 Uhr, der Eintritt kostet S/ 11 pro Erwachsener und ist online buchbar. Boote verlassen sich nicht innerhalb; jeder Kapitaen navigiert mit Abstand, der Abstand bleibt es war. Klimawandel und El Nino sind die Langfristfaktoren, die die Kolonien schwanken lassen; fuer Besucher bleibt die Rezeptur: frueh starten, kalte Jacke mitnehmen, und ein Tuch schuettet Seespray und Guano von der Linse."]
    ],
    stations:[
      ["Station 1, Hafen El Chaco","El Chaco ist der kleine Hafen am Suedende der Bucht, mit Kontrolle von SERNANP und Verkaufsständen der Bootsbetreiber. Kaufen Sie das Ticket vorab in der offiziellen Plattform oder am Steg; hinzu kommt eine Piergebühr von einigen Soles. Praktisch bringt die Bootschaft life vest, und die Kapitaene wählen nach Wind die Route. Wer seekrank ist, sitzt hinten und haelt den Blick an den Horizont. Die legale Bootsdichte ist fruehmorgens steuerbar: vor 8 Uhr ist die See am ruhigsten.","El_Chaco_Paracas.jpg"],
      ["Station 2, El Candelabro","Nach gut zehn Minuten dreht das Boot am Kuestenabhang der Halbinsel, und das El Candelabro tritt sichtbar: ein Riss von rund 180 Metern Laenge, in Sand und Stein geritzt, mit zwei seitlichen Ausläufern. Vom Meer wirkt es wie eine monumentale Gravur; von der Landstrasse waere es nur als Flaeche zu erkennen; das Symbol lebt von der Perspektive. Das Boot legt nebst kurz an, niemand geht betreten, Schweregreifer: Man kann mit Regel zu Betreten der Sandflaeche nicht platt machen.","El_Candelabro.jpg"],
      ["Station 3, Rundfahrt an den Inseln","Die eigentliche Rundfahrt dauert etwa 1,5 Stunden entlang der Felswaende. Von weitem sind die Brutplateaus von Guanoscharben und Tölpeln als weisse Streifen an den Waenden erkennbar, Seelöwen lagern im unteren Uferbereich. Humboldtpinguine stehen sparsam einzeln an Felsschichten; wer sie zuerst beobachten will, sucht auf ruhigem Wasser. Es ist kalt und nass: Windjacke und Wasserschutz, keine Kabine und kein Steg an Bord. Der Rueckweg erklaert die Bedeutung der Abstandsregeln, die die Kapitaene einhalten: Die Tiere sind Natur, kein Zoobesuch.","Ballestas_Islands_Penguins.jpg"]
    ],
    praktisch:["Eintritt SERNANP: S/ 11 pro Erwachsener, S/ 3 fuer Kinder von 5 bis 16, unter 5 frei; online buchbar ueber die SERNANP-Plattform.","Bootsfahrpreis: rund S/ 40, an Feiertagen bis S/ 60, plus Hafengebühr; der Fahrpreis variiert je nach Boot und Agentur.","Zeitfenster: Montags bis sonntags 6 bis 13 Uhr, später wird der Wind auf, beste Zeit vor 8 Uhr.","Dauer: Gesamtfahrt rund 2 Stunden, bei ruhigem Wetter verlängerbar.","Basis: El Chaco, zehn Gehminuten vom Paracas-Dorf, mit Restaurants, einfachen Unterkünften und dem Bootssteg; Ticket vorher online spart Zeit am Pier."],
    sources:["adondeviajar.mx: Islas Ballestas precio y horarios 2026","sernanp.gob.pe: Reserva Nacional de Paracas","advguides.com: Ballestas Islands Wildlife Guide"]
  },

  {
    id:"raqchi",

    meta:["Tempelruine mit Zyklopenmauer","ca. 3.450 m","117 km südlich von Cusco","Separates Eintrittsticket"],
    intro:[
      "Raqchi liegt an der Landstraße Cusco-Puno und ist vor allem eines: eine Ruine, die aus dem Busfilm verschwunden wirkt. Der zentrale Bau war ein Tempel für Wiracocha, den Schöpfergott, rund 92 Meter lang, einmal mit großem Dach; erhalten ist die hohe Rückwand, unten exakte Inka-Steinsetzung, oben riesige Lehmziegel. Rundherum stehen Reihen runder Speichergebäude, die das Bild der Anlage prägen.",
      "Dieses Kapitel geht den kurzen Rundgang ab: Tempelwand, Speicherreihen, Sonnentempel und Wasserkanäle. Wir lesen die Mischbauweise als Nachrichtenarchitektur: Der untere Steinblock ist Inka-Grammatik, die Lehmbauzeuge oben zeigen experimentellen Übergang. Raqchi gehört nicht zum Boleto Turístico; es gibt ein separates Ticket des Kulturministeriums, das man an der Kasse bar löst. Wer mit dem Touristbus unterwegs ist, bekommt Raqchi oft als Morgenstopp eingeplant auf der Strecke Cusco-Puno."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#e9e4d8"/><rect x="120" y="150" width="480" height="40" fill="#8e7d64"/><rect x="120" y="150" width="90" height="40" fill="#b6ac8f"/><text x="360" y="140" font-size="12" fill="#3b4652" text-anchor="middle">Tempel Wand</text><g fill="#a8967d" stroke="#8e7d64" stroke-width="1"><circle cx="150" cy="260" r="14"/><circle cx="220" cy="260" r="14"/><circle cx="290" cy="260" r="14"/><circle cx="360" cy="260" r="14"/><circle cx="430" cy="260" r="14"/><circle cx="500" cy="260" r="14"/><circle cx="570" cy="260" r="14"/><circle cx="150" cy="310" r="14"/><circle cx="220" cy="310" r="14"/><circle cx="290" cy="310" r="14"/><circle cx="360" cy="310" r="14"/><circle cx="430" cy="310" r="14"/><circle cx="500" cy="310" r="14"/><circle cx="570" cy="310" r="14"/></g><text x="360" y="355" font-size="12" fill="#3b4652" text-anchor="middle">Speicheranlehnung</text><rect x="40" y="96" width="80" height="16" rx="4" fill="#6f5c4b"/><text x="80" y="88" font-size="12" fill="#3b4652" text-anchor="middle">Eingang</text><g font-size="14" font-weight="bold"><circle cx="80" cy="112" r="12" fill="#3b4652"/><text x="80" y="117" fill="#fff" text-anchor="middle">1</text><circle cx="170" cy="170" r="12" fill="#3b4652"/><text x="170" y="175" fill="#fff" text-anchor="middle">2</text><circle cx="440" cy="275" r="12" fill="#3b4652"/><text x="440" y="280" fill="#fff" text-anchor="middle">3</text><circle cx="170" cy="345" r="12" fill="#3b4652"/><text x="170" y="350" fill="#fff" text-anchor="middle">4</text></g><g font-size="18" font-weight="bold" fill="#3b4652"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht maßstäblich: Der Tempelbau ragt als langer Strich in die Anlage, vor ihm liegen die Reihen der Speichersilos, auf der linken Seite ist der Eingangsbereich.",
    planStations:[
      ["Eingang und Kasse","Straßennähe, hier Ticket des Kulturministeriums lösen."],

    ],
    history:[
      ["Bauzeit und Vorgeschichte","Raqchi war in Inka-Zeiten ein wichtiger Station auf der Straße nach Collao, ein Zeremonialort mit großem Wiracocha-Tempel, umfolgt von Wohnvierteln für Priester und Pilger und von über hundert Rundbauten als Vorratspeicher. Die Bauweise erklärt das Alter: die unteren Mauerpartien aus exakt geschnittenem Stein gelten als Inka-Arbeit, die oberen aus Raseneisen-Lehmstein als etwas_experimenteller Teil für Gewölbetrappe. Nach der Eroberung verfiel der Tempel, die Speicher blieben als Silhouetten besser getragen als der Rest."],
      ["Symbolik und Funktion","Theologisch stand Raqchi in einer Reihe mit den ältesten Heiligtümern: Wiracocha galt als Schöpfergott, der aus dem Titicacasee Sonne, Mond und Sternen erschuf, bevor er das Volk der Inka einsetzte. Der Tempel war also kein Markttempel, sondern ein Bildgedächtnis für Herkunft. Die riesigen Speicher erzaehlen eine zweite Geschichte: Sie zeigen, dass hier hohe Mengen Vorrat auf der Straße Cusco-Puno gepuffert wurden, Stütze der Kontrolle und der Armeebewegungen in Richtung Titicacasee."],
      ["Wandel und Gegenwart","Raqchi ist heute Standard-Reisestopp auf der Ruta del Sol zwischen Cusco und Puno, meistens mit Bussen, die 45 bis 60 Minuten Verbleiben einplanen. Verwaltet wir es Kulturministerium, DDC Cusco, Öffnungszeit im Schnitt 7 bis 17 Uhr; das Ticket ist unabhängig vom Boleto Turístico. Am Wochenende sind Marktstände und Handwerker tätig, die Keramik der Region anbieten. Wer ohne Bus fährt, plant eine halbe Tagesstrecke ein, um Tempel, Speicher und Wasseranlagen in Ruhe zu lesen."]
    ],
    stations:[
      ["Station 1, Eingang","Von der Straße führt ein kurzer geschotterter Weg zur Kasse. Das Ticket ist separat und günstig, bar in Soles am Schalter. Nach dem Eintritt läuft man ein kurzes Stück flaches Grünland Richtung Tempel; die Höhe ist spürbar, aber deutlich milder als in Puno. Halten Sie am Anfang den Blick für das große Bild: Die Anlage erstreckt sich links der Straße, eine Tafel zeigt den Gesamtplan. Da der Rundgang kurz ist, lässt er sich in 45 Minuten komplett lesen.","Raqchi_Temple.jpg"],
      ["Station 2, Tempel-Wand","Die Rückwand des Wiracocha-Tempels ist das zentrale Motiv und misst 14 Meter Höhe. Betrachten Sie die Bauweise: unten zyklopische Quader, oben grobe Lehmsteine, im Wechsel mit Steinfüllungskammern. Die Wand trug einst ein großes Dach, das den Innenraum hinaus weit mehr irritierte; von der einstigen Größe des Baus erfährt man nur aus der Länge 92 Meter. Wer genau schaut, sieht die Kontinuität von Kolla- und Inka-Bau, bevor die Eroberung dem Kult ein Ende setzte.","Raqchi_Wall.jpg"],
      ["Station 3, Speicherreihen","Hinter dem Tempel stehen Reihen runder Rundbauten mit Lüftungsschlitzen in den Wänden, über hundert Vorratssilos, die auf der Höhe trocken und stabil gehalten wurden. Praktisch: Die Bauform verhinderte Feuchtigkeit, das Korn konnte mehrere Jahre gelagert werden. Die Silhouetten erinnern an kleine Türme; von oben am Rückweg wirkt Rekche wie ein kleines städtisches Areal, das von einem Tempel bewacht wurde. Bleiben Sie auf den gekennzeichneten Pfaden, die Böden sind sensibel und Betreten abseits der Pfade ist untersagt.","Raqchi_Colcas.jpg"],
      ["Station 4, Wasserbecken und Rückweg","Am unteren Rand der Anlage liegen Wasserbecken und Quellrinnen, die rituelle und hauswirtschaftliche Funktion gleichzeitig verhüllten. Wasser war im Kult Victoria, und die Kanäle zeigen die ordinate Sorgfalt der Inka auch bei secundären Anlagen. Der Rückweg zum Eingang dauert kaum zehn Minuten; unterwegs sind Marktstände mit Keramik der Region, die für kleine Scheine negotiable sind. Wer nach Puno weiter will, kehrt zur Straße zurück; Speisen und Kaffee gibt es an kleinen Familienständen gesationen von der Kasse.","Raqchi_Water.jpg"]
    ],
    praktisch:["Eintritt: separates Ticket des Kulturministeriums (nicht im Boleto Turístico enthalten), bar an der Kasse; Betrag vor Ort prüfen.","Anfahrt: rund 117 km südlich von Cusco auf der Straße nach Puno; als Stopp auf der Ruta del Sol oder als Halbtagesfahrt mit Bus oder privatem Taxi.","Öffnungszeit: täglich 7 bis 17 Uhr nach DDC Cusco, Stand Okt 2026.","Besuchsdauer: 45 bis 90 Minuten, flaches Gelände, gut machbar auch mit Kind.","Sonnenschutz: Die Plateaulage ist offen, UV-Index hoch, Kopfbedeckung gehört dazu."],
    sources:["peruvian.travel: Raqchi First-Timers Guide 2026","viajacongus.com: Raqchi Templo de Wiracocha","DDC Cusco: Besuchsregeln Archäologischer Park Raqchi"]
  },
  {
    id:"colca",
    name:"Canyon del Colca",
    alt:"Kondore und Terrassenwelt",
    meta:["Cruz del Condor","Boleto Turístico S/ 70","ab Arequipa 3 bis 4 Std.","Kondore am Vormittag"],
    intro:[
      "Der Canyon del Colca gilt als einer der tiefsten Canyons der Welt und ist landschaftlich eine Stufenlandschaft: Hochplateau mit Vicunas, dann ein Talhang voller vorkolumbianischer und kolonialer Terrassen, dann die enge Schlucht. Zentralmotiv für Besucher ist die Cruz del Condor, ein Aussichtspunkt, an dem die Kondore am Vormittag auf dem Aufwin kreisen. Die Anfahrt von Arequipa nimmt drei bis vier Stunden über den Pass Patapampa auf 4.910 Metern.",
      "Dieses Kapitel erklärt den klassischen Kurzbesuch ab Arequipa: Chivay als Basis, die heißen Quellen, am nächsten Morgen die Cruz del Condor und danach Rückfahrt oder Weiterfahrt Richtung Puno. Wichtig ist der Boleto Turístico del Colca: Er kostet für ausländische Erwachsene S/ 70, ist am Kontrollpunkt nahe Chivay bar zu bezahlen und deckt das komplette Tal samt Reserve Salinas y Aguada Blanca ab. Für die Mehrheit reicht der Zweitagestrip."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#d8c9a8"/><path d="M0,180 C140,120 280,220 420,180 S620,240 720,200" fill="none" stroke="#8e7d64" stroke-width="8"/><path d="M0,180 C140,120 280,220 420,180 S620,240 720,200 L720,400 L0,400 Z" fill="#7a8a6a"/><rect x="40" y="80" width="100" height="16" rx="4" fill="#6f5c4b"/><text x="90" y="74" font-size="12" fill="#3b4652" text-anchor="middle">Vicuña-Streifen</text><rect x="330" y="90" width="120" height="16" rx="4" fill="#6f5c4b"/><text x="390" y="84" font-size="12" fill="#3b4652" text-anchor="middle">Cruz del Condor</text><rect x="540" y="80" width="100" height="16" rx="4" fill="#6f5c4b"/><text x="590" y="74" font-size="12" fill="#3b4652" text-anchor="middle">Chivay</text><path d="M140,100 L180,160" fill="none" stroke="#b59f7d" stroke-width="4"/><path d="M400,105 L400,160" fill="none" stroke="#b59f7d" stroke-width="4"/><path d="M590,100 L550,170" fill="none" stroke="#b59f7d" stroke-width="4"/><g font-size="14" font-weight="bold"><circle cx="150" cy="105" r="12" fill="#3b4652"/><text x="150" y="110" fill="#fff" text-anchor="middle">1</text><circle cx="395" cy="105" r="12" fill="#3b4652"/><text x="395" y="110" fill="#fff" text-anchor="middle">2</text><circle cx="590" cy="105" r="12" fill="#3b4652"/><text x="590" y="110" fill="#fff" text-anchor="middle">3</text></g><g font-size="18" font-weight="bold" fill="#3b4652"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht maßstäblich: Die Route ab Arequipa über den Pass Patapampa nach Chivay, am Folgetag die Cruz del Condor im Tal, Rückweg über dieselbe Straße.",
    planStations:[
      ["Pass Patapampa","4.910 m, Panoramablick auf Vulkane, hier(te) Acclimatisierung."],
      ["Chivay","Basisort mit heißen Quellen, Kontrollpunkt für den Boleto."],
      ["Cruz del Condor","Aussichtspunkt, Kondore kreisen zwischen 8 und 10.30 Uhr."],
      ["Rückfahrt oder Weiterfahrt","nach Arequipa oder Richtung Puno über den Pasaje."]
    ],
    history:[
      ["Bauzeit und Vorgeschichte","Das Tal war vorkolumbianisch dicht besiedelt: Collagua und Cabana bauten die Systeme von Terrassen, Bewässerungskanälen und Speichern, die das Tal bis heute prägen; die Inka übernahmen und erweiterten das Netz. Die koloniale Phase führte Reducciones ein, die heutigen Dörfer wie Chivay, Yanque, Cabanaconde sind Gründungen dieser Phase, und die Kathedrale von Chivay ist ein kolonialer Markierungspunkt. Unterschiedliche Hutfaschen der Collagua und Cabana bleiben als Traditionsrotation wahrnehmbare Signatur des Tals."],
      ["Symbolik und Funktion","Für die Talbewohner war die Schlucht kein Landschafts erschrecken, sondern die nutzbare Mitte: Terrassen folgen der Kante, die Tiefe zählt als Höhenschicht fürMais und Obst, die Hänge als Wirtschaftszone für Kartoffel und Vieh. Der Kondor hat eine eigene Rolle als Vogel der Übergänge: Er kreist nach Sonnenaufgang auf dem Thermik-Wind, der aus der Tiefe steigt, und genau die Kultur vor dem Blick der Cruz del Condor. Für Fotografen ist der Leitsatz: Die Kondore sind nicht darstellbare Fauna, sie sind Teil des Terrassensystems, das die Region zum Vorkommen der Anbaulinie machte."],
      ["Wandel und Gegenwart","Heute zeigt der Colca die typische Doppeltourismusstruktur: Kurzreisende mit Zweitagestrip und mehrmonatige Wanderer, die die Schluchtenroute mit Zelten macht. Eintritt Boleto Turístico S/ 70 bar, hierzu noch alternative Gebühren an heißen Quellen und Parkplätzen. Alternativverkehr sind Ballettfüße auf Landstraße; Vicunaprojektionen in Salinas und Aguada Blanca sind Naturschutzprojekt. Kolonialbauten sind restauriert, Hohe Wege sind gut markiert, Höhenrampe ist Wichtigste Voraussage: langsam ansteigen, Wasser trinken, Alkohol meiden."]
    ],
    stations:[
      ["Station 1, Pass Patapampa","Die Fahrt von Arequipa führt über den Pass Patapampa auf 4.910 Meter, mit Aussicht auf die Vulkane Misti, Chachani und Sabancaya. Der Stopp dient klar dem Anfang, damit sich ihr Körper auf die Höhe einstimmt; Gehen Sie langsam, atmen Sie führen tief. Die Landschaft ist Steinwüste mit Vicuña-Parkplatz-Anbau, Steinfelder und Lumpen von Wolkenschutz. Praktisch: Coca-Tee wirkt mild, Schwindel ist kein Kavaliersdelikt, sondern Achtungsignal. Von hier zeigt sich die Stufenstruktur, die den Colca auszeichnet und ihn von jeder flachen Wüste unterscheidet.","Patapampa_Pass.jpg"],
      ["Station 2, Chivay","Chivay ist der Hauptheimatort des unteren Colca, Basis für Unterkunft und heiße Quellen, rund 3.600 Metern hoch. Der Kontrollpunkt für die Ticketzahlung liegt unmittelbar davor; Boleto Turístico del Colca ist S/ 70 bar. Der Ort verfügt über warme Quellen und Bezuchen: Markt normal, Straßen klein, Abend kalt. Die Thermalfelder liegen am Stadtrand; der Eintritt liegt bei etwa S/ 15 und macht nach der Fahrt viel Sinn. Für Wandernde ist Chivay der Startpunkt für die Route über Cabanaconde weiter in die Tiefe.","Chivay_Plaza.jpg"],
      ["Station 3, Cruz del Condor","Die Cruz del Condor liegt am steilsten Teil der Schlucht, der Blick fällt rund 1.200 Meter in die Tiefe. Der Named Moment beginnt meist um 8 Uhr und läuft bis etwa 10.30 Uhr, je nach Thermik und Wetter: Kondore steigen aus den Nestern auf und kreisen im Aufwind. Platzmangel ist real, am späteren Morgen stehen viele Busse; Wer kommen will, rechnet mit taxischem Anlauf ab Chivay um halb sieben. Praktisch: Ruhig stehen bleiben, nicht füttern, nicht über die Sicherheitsnahe hinaus.; der Bereich ist ungeschützt.","Cruz_del_Condor.jpg"]
    ],
    praktisch:["Boleto Turístico del Colca: S/ 70 für ausländische Erwachsene, 2026, bar am Kontrollpunkt nahe Chivay, gilt für das gesamte Tal und die Reserva Salinas y Aguada Blanca.","Fahrt: Arequipa nach Chivay 3 bis 4 Std. über den Pass Patapampa (4.910 m), Busse und Touren täglich.","Höhe: Chivay ca. 3.600 m, Pass 4.910 m; langsam ansteigen, Wasser, coca tee.","Kondor-Zeit: Cruz del Condor besten von 8 bis 10.30 Uhr; wer früh kommt, vermieden Busscharen.","Zusatzkosten: heiße Quellen ca. S/ 15, einige Parkplätze und Wegegebühren kommen hinzu."],
    sources:["arequipa.com: Colca Canyon Entrance Fee 2026","andinoperutours.com: Boleto Turístico del Colca 2026","peruhop.com: Colca Route Guide"]
  },
  {
    id:"paracasres",
    name:"Reserva de Paracas",
    alt:"Wüste, Klippen, La Catedral",
    meta:["Küstenreservat SERNANP","Eintritt S/ 11","Rundweg ca. 26 km","La Catedral, Playa Roja"],
    intro:[
      "Die Reserva Nacional de Paracas ist Wüstengebiet und Meeresschutzzone gleichzeitig: 335.000 Hektar, ein Großteil Meeresfläche, die Küste darin als langer heller Streifen. Die Landroute verbindet Strände, Klippen und Aussichtspunkte: Supay, La Catedral, Playa Roja, Lagunillas, dazu das Informationszentrum. Landschaftlich ist die Reserva schroffer als Ballestas: keine Tuff-Türme, sondern Steilküste, rote Strände und immer vom kalten Strom gepeitschtes Wasser.",
      "Dieses Kapitel führt Sie entlang des Landrundwegs ab dem Kontrolltor am km 27:erst Informationszentrum, dann La Catedral und Playa Roja, dann Lagunillas als Badestopp und Rückweg nach El Chaco. Praktisch grenzen wir das Kapitel scharf vom Ballestas-Kapitel ab: Die Gestaltungslogik der Reserva ist Fahren und Halten, die der Inseln ist Bootsfahrt. Wer beides am selben Tag macht, sollte Boot früh und Landroute danach planen, um die Nachmittagsstoffe zu vermeiden."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#7fb4c9"/><path d="M0,340 C120,300 220,320 320,280 S520,240 700,260 L720,400 L0,400 Z" fill="#d9c28f"/><path d="M300,270 C340,250 380,270 400,290" fill="none" stroke="#b0413e" stroke-width="8"/><text x="360" y="250" font-size="11" fill="#8e3a2f" text-anchor="middle">Playa Roja</text><rect x="480" y="180" width="120" height="60" fill="#a8967d" stroke="#8e7d64" stroke-width="2"/><text x="540" y="215" font-size="11" fill="#fff" text-anchor="middle">La Catedral</text><rect x="120" y="330" width="90" height="16" rx="4" fill="#3b4652"/><text x="165" y="342" font-size="11" fill="#fff" text-anchor="middle">Kontrolltor</text><ellipse cx="620" cy="330" rx="35" ry="14" fill="#5f8caa"/><text x="620" y="334" font-size="11" fill="#fff" text-anchor="middle">Lagunillas</text><g font-size="14" font-weight="bold"><circle cx="165" cy="338" r="11" fill="#3b4652"/><text x="165" y="342" fill="#fff" text-anchor="middle">1</text><circle cx="440" cy="270" r="11" fill="#3b4652"/><text x="440" y="274" fill="#fff" text-anchor="middle">2</text><circle cx="540" cy="210" r="11" fill="#3b4652"/><text x="540" y="214" fill="#fff" text-anchor="middle">3</text><circle cx="620" cy="330" r="11" fill="#3b4652"/><text x="620" y="334" fill="#fff" text-anchor="middle">4</text></g><g font-size="18" font-weight="bold" fill="#fff"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht maßstäblich: Ab Kontrolltor am km 27 läuft der Rundweg über Informationszentrum, La Catedral und Playa Roja nach Lagunillas und zurück nach El Chaco.",
    planStations:[
      ["Kontrolltor und Infozentrum","Eintritt S/ 11, Karte und Übersichtstafeln."],
      ["La Catedral","Steilbogenklippe, einst Beobachtungsturm, Meer unten."],
      ["Playa Roja","rotbrauner Strand, Mineralogene Messung."],
      ["Lagunillas","Badestrand mit Restaurants und Rückweg."]
    ],
    history:[
      ["Gründung und Status","Die Reserva wurde am 25. September 1975 gegründet und 1992 unter die Ramsar-Konvention für Feuchtgebiete von internationaler Bedeutung aufgenommen. Sie schützt Küste, Inseln und Meeresfläche um die Halbinsel Paracas, und die Ballestas-Inseln gehören als Guano-Reserve verwaltungsmäßig ins gleiche SERNANP-System. Interdependenzen sind schwer: Die Reserva teilt sich mit der Ballestas-Route denselben SERNANP-Eintrittssatz, und für beide Stempel gibt es Combination S/ 17, was kombinierte Besuche effizient macht."],
      ["Ökologie und Nutzung","Die Landschaft lebt aus dem Kontrast: fast keine Vegetation, Kargheit an Land, während das kalte Auftriebswasser vor der Küste Nährstoffe und damit Vögel und Seelöwen liefert; das ist dieselbe Humboldt-Dynamik wie vor Ballestas. Fischerei ist lokal reguliert, der Tourismus in Zonen geführt. Wer mit dem Fahrzeug kommt, bleibt auf markierten Pisten: Die Vegetationsdecke ist dünn und Spuren bleiben Jahrzehnte stehen"],
      ["Wandel und Gegenwart","Für Besucher hat sich das Regelwerk verfestigt: SERNANP-Eintritt S/ 11 online oder an der Garita, Kontrollpunkt am km 27 der Straße Pisco-Paracas. Der Rundweg ist ca. 26 Kilometer und nimmt radeln oder mit ATV 4 bis 6 Std., La Catedral liegt rund 10 km nach dem Tor auf befestigter Straße. Zunehmend werden Gebiete periodisch gesperrt, um Strände für Brutvögel zu schonen; am Zentrum hängen aktuelle Karten. Wind ist die bestimmende Eigenschaft des Nachmittags, der Morgen ist stabiler."]
    ],
    stations:[
      ["Station 1, Kontrolltor und Informationszentrum","Der Eintritt zur Reserva beträgt S/ 11 und lässt sich online über das SERNANP-Portal oder an der Kontrollstation am km 27 lösen; Kassenterminal ist nicht zu garantie. Nach dem Tor geht es zum Informationszentrum mit Karten, Ausstellung zum Ökosystem und Überblick über die aktuelle Routensperren. Am Morgen wirkt die Reserva am zugänglichsten: Wüstentemperatur bleibt angenehm, Nachmittagswind ist steife Böe. Für Radfahrer ist der Kopf der Route einfach, für Autofahrer ist der Weg grob geschottert, aber klar.","Paracas_Reserve.jpg"],
      ["Station 2, La Catedral","La Catedral ist eine Klippenform in einem Sandsteinbogen, dessen Blickpapier sich nach dem Erdbeben 2007 geändert hat und nun als offene Felswand wirkt. Vom Parkplatz geht es in wenigen Minuten zu einer Aussichtskante, das Meer schlägt unten gegen die Basis. Nicht auf die unversicherte Klippenkante hinaus, der Boden ist labil und bricht nach. Wer fotografieren möchte, bekommt vormittags Licht von der Seite, nachmittags flach und schwierig. Das Motiv ist groß; eine Weitwinkel­aufnahme, kein Tele, gibt das Format richtig wieder.","La_Catedral_Paracas.jpg"],
      ["Station 3, Playa Roja","Playa Roja ist ein rotbrauner Strand, dessen Farbe aus Mineral-Eisenstein in den Klippen kommt und im Kontrast zum azurblauen Wasser wirkt. Baden ist hier nicht sinnvoll, die Brandung ist stark, und die Strömung entlang der Küste ist unvorhersehbar. Die Flaggen und Absperrungen dienen der Brutvogelschutzzone; den markanten Pfad über die Klippe nach Supay kann man laufen. Für den Fotografen ist Playa Roja das einfachste Motiv der Reserva: Farbe, Kontrast, Kante liefern das Bild fast selbst. Bleiben Sie auf dem Pfad, um die Krustendüne nicht zu zerstören.","Playa_Roja.jpg"],
      ["Station 4, Lagunillas und Rückweg","Lagunillas ist ein Fischerstrand mit einfachen Restaurants, hier gibt es Ceviche und frische Fische direkt auf Anfrage. Der Strand ist geschützt und badefreundlicher als die offenen Küsten ore, die Brandung läufiger. Rückweg nach El Chaco dauert rund 30 Minuten auf der selben Route, mit Aussicht auf die Salinen am Rand der Bucht. Praktisch: Die Restaurantsruppe ist klein, und nachmittags ist alles voll; wer nach dem Bootsmorgen hier landet, bekommt meist gute Plätze. Bargeld gehört dafür in die Tasche.","Lagunillas_Beach.jpg"]
    ],
    praktisch:["Eintritt: S/ 11 Erwachsener, S/ 3 Kinder 5-16, unter 5 frei; Kombiticket Reserva plus Ballestas S/ 17.","Kontrolltor: km 27 der Straße Pisco-Paracas; online buchbar über SERNANP-Portal, Karte nicht garantiert.","Rundweg: ca. 26 km, 4 bis 6 Std. mit Fahrrad oder ATV; La Catedral rund 10 km nach dem Tor.","Wetter: Nachmittags starker Wind, vormittags ruhiger; kaltes Wasser, Strömung ernst nehmen.","Verpflegung: nur an Lagunillas; Wasser und Snacks von El Chaco mitnehmen."],
    sources:["paracasperu.com: Paracas National Reserve Entrance Fee 2026","tramitesperu.com: Reserva de Paracas SERNANP 2026","sernanp.gob.pe: offizielle Tarife und Karten"]
  },
  {
    id:"nazcahuacachina",
    name:"Nazca und Huacachina",
    alt:"Geoglyphen und Dünen-Oase",
    meta:["Sobrevuelo ab US$ 159","Mirador-Tower vor Ort","Huacachina-Dünen","Chauchilla und Cantalloc"],
    intro:[
      "Nazca und Huacachina liegen südlich von Paracas auf der Panamericana und bilden die meistgenommene Verlängerung der Küstenroute. In Nazca liegen die Geoglyphen: Hunderte von Bodendarstellungen aus dem 1. bis 6. Jahrhundert, vom Kolibri bis zum Affen, sichtbarer vor allem vom Flugzeug aus, aus der Höhe. Huacachina dagegen ist eine grüne Oase in Dünen gebettet, ein Wochenendeziel mit Buggy-Touren und Sandboarding auf den Hügeln rund um den See.",
      "Dieses Kapitel erklärt beide Optionen und deren Trade-off: Das Sobrevuelo zeigt die großen Figuren komplett und dauert rund 30 Minuten in der Luft, kostet ab US$ 159 und verlangt Festnerven bei kleinen Maschinen. Der Mirador-Tower vor Ort zeigt nur ein oder zwei Figuren vom Boden aus, ist aber günstig und windfest. Danach folgt der Abschnitt Huacachina: Buggy, Sandboard, Sonnenuntergang auf der Düne und der Rückzug in Oase mit Abendstimmung."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#d9b98a"/><rect x="0" y="330" width="720" height="20" fill="#8e7d64"/><text x="360" y="346" font-size="11" fill="#fff" text-anchor="middle">Panamericana</text><ellipse cx="160" cy="200" rx="110" ry="60" fill="#c9a86a" stroke="#a88a4f" stroke-width="2"/><text x="160" y="200" font-size="11" fill="#5a4a26" text-anchor="middle">Nazca-Plateau</text><ellipse cx="520" cy="190" rx="80" ry="50" fill="#5f8caa"/><ellipse cx="520" cy="200" rx="35" ry="14" fill="#5a8a3a"/><text x="520" y="205" font-size="10" fill="#0f2a08" text-anchor="middle">Oase</text><ellipse cx="620" cy="120" rx="55" ry="30" fill="#e6cf9d"/><ellipse cx="420" cy="100" rx="60" ry="32" fill="#e6cf9d"/><text x="520" y="90" font-size="11" fill="#8a6a2f" text-anchor="middle">Dünen</text><g font-size="14" font-weight="bold"><circle cx="160" cy="200" r="12" fill="#3b4652"/><text x="160" y="205" fill="#fff" text-anchor="middle">1</text><circle cx="460" cy="195" r="12" fill="#3b4652"/><text x="460" y="200" fill="#fff" text-anchor="middle">2</text></g><g font-size="18" font-weight="bold" fill="#5a4a26"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht maßstäblich: Panamericana verbindet Nazca mit Huacachina; das Plateau liegt westlich der Stadt, die Oase liegt direkt neben Ica im Norden.",
    planStations:[
      ["Nazca-Plateau","Geoglyphen, Mirador-Tower und Sobrevuelo-Strecke."],
      ["Aerodromo Nazca","Start und Landung der Kleinflugzeuge."],
      ["Huacachina-Dünen","Buggy-Runde und Sandboarding am Nachmittag."],
      ["Oase und Rückweg","Seeufer, Restaurants, Übernachtung oder Rückfahrt."]
    ],
    history:[
      ["Nazca-Kultur und Geoglyphen","Die Nazca-Kultur, ca. 1. bis 6. Jahrhundert, grub die Linien indem sie Eisenoxide und dunkle Steine entfernte, sodass der helle Untergrund zum Vorschein kam. Die Figuren reichen von Katze bis Kolibri auf einer Fläche, die man sich draußen als Lager von Phasen vorstellt; die Bedeutungsliste reicht von Kalendermarkierung bis Ritualpfad. Unter Forschern gilt Maria Reiche als treibender Kraft der Vermessung und des Schutzes, seit 1994 UNESCO-Welterbe."],
      ["Huacachina und Oasenwirtschaft","Die Oase entstand als private Ausflugsregion im 19. Jahrhundert und speiste aus einem natürlichen Aquifer, bald mit Villen und Bädern rund um den See. Die Nutzung war Wasserwirtschaft im Kleinformat: Spülung, Bewässerung von Palmen und Eukalyptus, kleine Hotels rings. Im 20. Jahrhundert führte Tourismus und Grundwasserschwankungen zu Rückführung und künstliche Zufluss, die heute als offiziell gepflegt gelten. Die Dünen sind touristisches Land und gleichzeitig Wildnis genug, um zu erschöpfen."],
      ["Wandel und Gegenwart","Heute zeigt sich die Route so: Sobrevuelo ab US$ 159, Mirador-Tower vor Ort günstig und windfest, Chauchilla und Cantalloc-Aquädukte als Baustein derselben Tagesroute dazu, Huacachina mit Buggy-Abfahrt ab Nachmittag. Für Besucher gilt Vorsicht: Die Kleinflugzeuge fliegen je nach Wetter und Sichtbarkeit unterschiedlich, kleine burst gefährlich bei Übelkeit; Tablette eine Stunde vorher. In Huacachina gibt es mittlerweile Fußwege, Lodges und Diskussionen über Wasserverbrauch; wer übernachtet, erlebt die Oase abends am besten."]
    ],
    stations:[
      ["Station 1, Mirador und Plateau","Am Plateau northwest der Stadt steht der Mirador-Tower, ein 13 Meter hoher Aussichtsturm, von dem man zwei Figuren sieht: Baum und Hände. Der Aufstieg ist Treppenarbeit mit Hitze, Foto am späteren Nachmittag gibt schärfere Kontraste. Für den Rest der Figuren braucht es das Flugzeug oder einen Tandem-Paraglider-Publikumsfall; Mirador allein reicht, um die Logik der Linien zu verstehen: Tausende von Kilometern an Linien in Wüstensand, sichtbar nur von der Höhe.","Nazca_Mirador.jpg"],
      ["Station 2, Sobrevuelo","Das Sobrevuelo startet am Aerodromo westlich der Stadt: Kleinflugzeug, Pilotin mit Kopfhörerkommentar, 30 Minuten Schleifen über die berühmten Figuren. Buchen Sie bei autorisierten Firmen, die Wartung und Pilotenerfahrung belegen; die Maschinen sind klein, leichtes Schaukeln ist unvermeidlich; Tablette und leichtes Frühstück helfen. Die Figuren sind in dieser Höhe sofort sichtbar: Kolibri, Affe, Spider, Condor, Astronaut; Kamera sichern, die Objektive schlagen. Wer zeitliche Mangelse hat, sollte Abruf bezüglich Wetter einbauen.","Nazca_Overflight.jpg"],
      ["Station 3, Huacachina Dünen","Die Buggy-Runden starten am Rand der Oase und gehen direkt in die Dünen: Anstieg, Abfahrt, kurze Pausen, bis zur Aussichtsdüne, dann Sandboarding auf dünnen Brettern. Der Fahrstand ist Fahrgeschwindigkeit hängt am Fahrer: hinten wird es zitterig, in der Mitte sitzt man stabil. Sonnenuntergang von der Dünenkante gehört zur Standardzusage: Sand glüht, Umriss des Wüstensand leucht, und der Rückweg in die Oase fällt als großes Übergangsbild an. Wasser und Sonnencreme sind Pflicht, der Sand ist intensiv.","Huacachina_Dunes.jpg"],
      ["Station 4, Oase und Umgebung","Die Oase ist ein rundgrüner Pool mit Palmen und Eukalypten, umringt von Hotels und Restaurants. Badewasser ist warm und trüb, der See gilt als ruhig, Baden wird geführt. Ein weiterer Stopp sind die Cantalloc-Aquädukte, spiralförmige Luftöffnungen der Nazca-Kultur, die Wasser vom Andenhügel führen, und der Friedhof Chauchilla mit mumifizierten Bestattungen aus derselben Epoche, teilweise unter freiem Himmel sitzend. Beide liegen westlich von Nazca und sind mit Taxi gut zu erledigen.","Huacachina_Oasis.jpg"]
    ],
    praktisch:["Sobrevuelo: ab US$ 159, rund 30 Minuten Flug, Buchung bei autorisierten Firmen, Tablette gegen Übelkeit eine Stunde vorher.","Mirador-Tower: günstige Alternative vor Ort, sieht nur eine oder zwei Figuren, keine Flugangst.","Huacachina: Buggy-und-Sandboard-Run ab rund S/ 60 bis 80, Nachmittagsstart ideal für Sonnenuntergang.","Anfahrt: Nazca liegt rund 2 Std. südlich von Paracas auf der Panamericana; Huacachina rund 5 km von Ica.","Klima: Nazca und Huacachina sind heiß und trocken, Wasser und Sonnenhut gehören dazu; kleine Scheine für Eintritte."],
    sources:["peruamericatours.com: Lineas de Nazca Sobrevuelo oder Mirador 2026","travelperutours.com: Tour Lineas de Nazca 2026","adondeviajar.mx: Paracas und Umgebung 2026"]

  {
    id:"machupicchu",
    name:"Machu Picchu",
    alt:"Die Zitadelle in den Wolken",
    meta:["2.430 m","Circuits 1, 2 und 3","S/ 152 plus S/ 11 SERNANP","Zeitfenster von 2,5 Std."],
    intro:[
      "Machu Picchu liegt auf 2.430 Metern auf einem Bergrücken über dem Urubamba, 1.000 Meter tiefer als Cusco, eingepackt in Nebelwald. Die Zitadelle wurde um 1450 unter Pachacutec gebaut und nach der Eroberung verlassen; Hiram Bingham brachte sie 1911 zurück in die Weltöffentlichkeit, Unesco-Welterbe seit 1983. Der Zugang ist streng geregelt: Eintrittskarten mit fixes Zeitfenster, ein Pflicht-Rundweg in eine Richtung, ein Lizenz-Guide für Gruppen.",
      "Dieses Kapitel entscheidet zuerst die Ticketfrage, dann die Route: Circuito 1 bietet die Panorama-Postkarte und Anschlüsse auf Sonnengate oder Berge, Circuito 2 verbindet das Klassikerfoto mit dem inneren Stadtkern, Tempel der Sonne, Heiliger Platz, Circuito 3 ist der kurze Royalty-Weg. Praktisch: Online vorbuchen über tuboleto.cultura.pe; morgens Slots sind in der Hochsaison 4 bis 5 Monate ausverkauft. Ab Aguas Calientes geht es per Bus oder zu Fuß hinauf zum Eingang."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#5a7a4a"/><path d="M0,340 C180,300 320,320 480,280 S660,300 720,280 L720,400 L0,400 Z" fill="#3f5a34"/><ellipse cx="360" cy="230" rx="220" ry="70" fill="#6a8a55"/><rect x="180" y="200" width="360" height="40" fill="#c9c2ab"/><rect x="220" y="160" width="60" height="40" fill="#b6ac8f"/><rect x="300" y="160" width="60" height="40" fill="#b6ac8f"/><rect x="380" y="160" width="60" height="40" fill="#b6ac8f"/><rect x="460" y="160" width="60" height="40" fill="#b6ac8f"/><text x="360" y="150" font-size="11" fill="#e9e4d8" text-anchor="middle">Wohnterrassen und Plaza</text><text x="600" y="330" font-size="11" fill="#d8e3ea">Urubamba</text><rect x="40" y="80" width="110" height="16" rx="4" fill="#6f2c4b"/><text x="95" y="74" font-size="12" fill="#e9e4d8" text-anchor="middle">Hut der Waechter</text><g font-size="14" font-weight="bold"><circle cx="95" cy="88" r="12" fill="#3b4652"/><text x="95" y="93" fill="#fff" text-anchor="middle">1</text><circle cx="250" cy="220" r="12" fill="#3b4652"/><text x="250" y="225" fill="#fff" text-anchor="middle">2</text><circle cx="410" cy="180" r="12" fill="#3b4652"/><text x="410" y="185" fill="#fff" text-anchor="middle">3</text><circle cx="560" cy="250" r="12" fill="#3b4652"/><text x="560" y="255" fill="#fff" text-anchor="middle">4</text></g><g font-size="18" font-weight="bold" fill="#e9e4d8"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht massstaeblich: Waechterhaus oben, darunter Stadt mit Plaza und Tempeln, unten der Urubamba; die Wege laufen in eine Richtung, Abkuerzen ist nicht erlaubt.",
    planStations:[
      ["Eingang und Waechterhaus","Ticketkontrolle, dann das klassische Panoramafoto."],
      ["Wohnterrassen und Stege","obere Landwirtschaftszone mit Blick auf die Anlage."],
      ["Stadtkern mit Tempeln","Plaza, Temple der Sonne, Heiliger Platz, beinahe jede Figur."],
      ["Weg hinunter","Rückweg zum Busbahnhof Richtung Aguas Calientes."]
    ],
    history:[
      ["Bauzeit und Vorgeschichte","Machu Picchu entstand um 1450 als Königssitz unter Pachacutec und blieb etwa hundert Jahre in Nutzung, vermutlich bis in die Regierungszeit Huaynas. Die Anlage verbindet Stadt und Landwirtschaft: Terrassen halten den Hang, Kanäle und Brunnen verteilen Quellwasser, Wohnquartier und Tempelbezirk liegen auf dem Rücken. Nach der Eroberung verfiel sie still, nie entdeckt von Spaniern, gebrannt von der Vegetation. Hiram Bingham dokumentierte sie 1911 systematisch, Nachforschungen der Yale-Expedition begannen die Weltkarriere des Ortes."],
      ["Symbolik und Funktion","Funktion ist umstritten: Royalsitz, Landsitz,religious Heiltum, Studienansort? Architektur spricht von einem Herrschaftsort, dessen Lage bewusst bestimmt verbunden ist: Apu Machu Picchu im Rücken, der Fluss im Abgrund, Sonnenstand am Intihuatana als Kalenderbezug. Der Tempel der Sonne mit seinem Fenster zur Junisaison-Sonnewende bindet den Ort an Zeremonialwissen; das Intihuatana, der Angelstein, hielt nach Inka-Verstand die Sonne fest am Himmel. Wer die Anlage liest, liest Mai- und Februartage gleichermaßen aus der Architektur."],
      ["Wandel und Gegenwart","Machu Picchu seit 1983 Unesco-Welterbe, seit 2007 Neues Weltwunder, und im Bedrängnissystem:.fixed Slots, Wegerechte, Höchstpersonenzahlen, Pflicht-Guide. Seit 1. Mai 2026 kommt pro Ticket eine SERNANP-Erhaltungsgebühr von S/ 11 hinzu, Ermäßigung zur Bewahrung des Heiligtums. Preise 2026: S/ 152 Basis-Ticket für ausländische Erwachsene, 77 Studierende, Kinder S/ 70; Strecke mit Bergbesteigung teurer. Slot-Regeln, nur vorwärts läuft der Rundweg, und Abfahrt innerhalb des Zeitfensters sind verpflichtend; ohne Guide wird der Eintritt verweigert."]
    ],
    stations:[
      ["Station 1, Eingang und Waechterhaus","Am oberen Eingang kontrolliert das Kulturministerium Ticket und Pass; ohne Guide gibt es keinen Zutritt. Von hier führt der Weg kurz hinauf zum Waechterhaus, dem POV für das klassische Panoramafoto: Stadt unten, Huayna Picchu als Felsgrat dahinter, Nebel am Morgen häufig. Die Plätze sind knapp, Fotografieren reihum: Fünf Minuten, dann weiter, alles läuft. Praktisch: Rucksack nur klein, Regenschutz und Wasser, keine Drohne, kein Stativ. Wer um 6 Uhr kommt, hat den Nebel meist schon verzogen.","Machu_Picchu_Overview.jpg"],
      ["Station 2, Wohnterrassen und Stege","Von der oberen walkway sieht man die Terrassen, die die gesamte Hangkante tragen und für Landwirtschaft, Stabilität und Abfluss gleichzeitig arbeiteten. Die Konstruktion ist sichtbar: grobe Steine unten, Erdschicht, dann feinerer Oberboden, Abflussrinnen am Rand; genau dieses System hält die Anlage seit Jahrhunderten. Der Blick nach unten zeigt die Stadt als Grundriss: quadratische Bauelemente, Höfe, Plätze nach Plan. Beachten Sie die Treppen: Fast alle Wege laufen einheitlich vorwärts, Rückverbindungen gibt es nicht; wer stehen bleibt, verbringt nicht die eigenen Zeit.","Machu_Picchu_Terraces.jpg"],
      ["Station 3, Stadtkern und Tempel","Im Stadtkern liegen der Tempel der Sonne mit seinem gebogenen Mauerwerk, der Heilige Platz, der Dreifalten-Tempel und die Wasserbrunnen, die Quellwasser bis heute führen. Der Tempel der Sonne zeigt die Feinste der Inka-Baukunst: Quader ohne Mörtel, so gerundet wie ein Zylinder, Fenster zur Sonnenwende. Die genaue Nutzung ist umstritten, die Sorgfalt aber nicht. Betreten ist verboten, anfassen auch; alles läuft von außen. Bei Regen sind die glatten Steine nass und rutschig, Schuhe mit Profil sind sinnvoll. Der Intihuatana liegt wenn am Chefstand oben, je nach Circuit.","Machu_Picchu_Temple_Sun.jpg"],
      ["Station 4, Rückweg und Aguas Calientes","Der Rückweg führt das Ende des Rundwegs zur Busstation, mit Blick zurück auf die Zitadelle; die Busrunde dauert 25 Minuten und kostet rund S/ 12 je Fahrt. Unten in Aguas Calientes lohnt Mittagessen und ein Blick auf den Rio Vilcanota; wer Zeit hat, springt in die heißen Quellen des Ortes. Zurück geht es mit dem Zug nach Ollantaytambo oder, wer wie bei der Reise Richtung Heiliges Tal geht, per Bus zur Hidroelectrica und dann zu Fuß entlang der Schiene. Merkregel: Machu Picchu früh, Aguas Calientes danach, Zug abends.","Aguas_Calientes_Train.jpg"]
    ],
    praktisch:["Tickets: Basis-Ticket ausländische Erwachsene S/ 152, mit Berg-Besteigung mehr, dazu SERNANP-Gebühr S/ 11 (seit Mai 2026); offiziell über tuboleto.cultura.pe.","Zeitfenster: fixeden Einlassfenster, rund 2,5 Stunden Aufenthalt, morgens Slots in Hochsaison oft 4 bis 5 Monate ausverkauft.","Anfahrt: Zug nach Aguas Calientes oder Trektrack; von dort Bus S/ 12 je Fahrt oder 1,5 Std. Treppen.","Guide: Lizenz-Guide ist Pflicht; am Eingang buchbar, Gruppenpreise variieren.","Basen: Ollantaytambo für frühen Zugstart, Aguas Calientes für Nacht davor; Regenjacke, Wasser und Passeports gehören dazu."],
    sources:["entradaamachupicchu.com: Precios Entrada Machu Picchu 2026","enperu.org: Machu Picchu Tickets 2026","inkajungletour.com: Circuits Official Guide 2026"]

  {

    intro:[
      "Cusco war die Hauptstadt des Inka-Reiches und ist heute eine Stadt, die ihre Geschichte in Schichten zeigt: Inka-Mauern im Straßenbild, Kolonialkirchen obendrauf, Plaza de Armas als Zentrum. Der Spaziergang durch die Altstadt liest sich wie eine Verdichtung der Reise: Qorikancha, einst Tempel der Sonne, zeigt Inka-Mauern und Santo Domingo konfrontiert; die Kathedrale hält ein Bildgedächtnis der Eroberungsthematik; San Pedro liefert Markt-Alltag.",
      "Dieses Kapitel geht die Altstadt in einer Runde ab: Plaza de Armas, Kathedrale, Qorikancha, San Blas mit Blick, San Pedro Markt, dazu Saqsaywaman über der Stadt als Halbtages-Anhang. Wichtig sind die three Ticket-Logiken: Qorikancha ist separater Eintritt von S/ 20, Kathedrale S/ 40, Saqsaywaman und vier weitere Ruinen laufen über den Boleto Turístico del Cusco Circuit I S/ 70. Qorikancha-Museum gehört zur Boleto-Circuito II."

    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#e9e4d8"/><rect x="300" y="150" width="90" height="70" fill="#b0413e"/><text x="345" y="190" font-size="10" fill="#fff" text-anchor="middle">Catedral</text><rect x="330" y="250" width="80" height="16" rx="3" fill="#5f8caa"/><text x="370" y="279" font-size="10" fill="#3b3040" text-anchor="middle">Plaza de Armas</text><rect x="480" y="230" width="120" height="60" fill="#a8967d"/><text x="540" y="265" font-size="10" fill="#fff" text-anchor="middle">Qorikancha</text><rect x="120" y="230" width="120" height="50" fill="#a8967d"/><text x="180" y="260" font-size="10" fill="#fff" text-anchor="middle">San Pedro</text><ellipse cx="160" cy="90" rx="80" ry="40" fill="#8e7d64"/><text x="160" y="93" font-size="11" fill="#fff" text-anchor="middle">Saqsaywaman</text><g font-size="14" font-weight="bold"><circle cx="345" cy="185" r="11" fill="#3b3040"/><text x="345" y="189" fill="#fff" text-anchor="middle">1</text><circle cx="540" cy="260" r="11" fill="#3b3040"/><text x="540" y="264" fill="#fff" text-anchor="middle">2</text><circle cx="180" cy="255" r="11" fill="#3b3040"/><text x="180" y="259" fill="#fff" text-anchor="middle">3</text><circle cx="160" cy="90" r="11" fill="#3b3040"/><text x="160" y="94" fill="#fff" text-anchor="middle">4</text></g><g font-size="18" font-weight="bold" fill="#3b3040"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht massstaeblich: Plaza de Armas als Zentrum, Kathedrale am Nordrand, Qorikancha suedostlich, San Pedro westlich, Saqsaywaman ueber der Stadt am Stadtrand.",
    planStations:[
      ["Plaza de Armas und Kathedrale","Zentrum mit Kolonialarkaden, Kathedrale mit Museum-Eintritt."],
      ["Qorikancha und Museum","Inka-Tempel unter Santo Domingo, separater Eintritt."],
      ["San Pedro und San Blas","Markt und Blicker-Viertel mit Cafes"],
      ["Saqsaywaman","Zickzack-Waende oberhalb der Stadt, Boleto Circuito I"]
    ],
    history:[
      ["Inka-Hauptstadt und Pavane","Cusco war das Zentrum des Reiches, gegründet nach Legende von Manco Capac, umgebaut und vergrößert unter Pachacutec ab Mitte des 15. Jahrhunderts. Die Stadt war als Puma geplant: Saqsaywaman als Kopf, die Straßen als Gliedmaße, der Coricancha als Zentrum von Sunnisch-Tempel und Palastbezirken. Nach der Eroberung 1533 wurde die Struktur überbaut: Kolonialpaläste und Kirchen auf Inka-Mauern.Plaza de Armas war einst der Hauptplaza, heute Eventpunkt der city, umrandete von Arkaden und Kathedrale."],
      ["Kolonie und Glaube als Strategie","Die Spanier nutzten die Inka-Stadt als Fundament: Santo Domingo auf dem Qorikancha, die Kathedrale auf dem Palastplatz der Wiracocha. Die Barockkunst des Cusco, gebaut von indigenen Werkstätten, füllt die Kirchen: Bilder von Marcos Zapata, Goldaltar, von der letzten Abendmahlart mit Meerschweinchenfutter. Religiöse Eroberungsthematik bleibt sichtbar: Die Kathedrale ist nicht nur Bauwerk, sondern Medium von Ersatz und Machtwechsel. Wer genau hinsieht, erkennt Inka-Mauerteile als Fundament der Kirchen unter der Stadtmauer."],
      ["Wandel und Gegenwart","Cusco zeigt heute den Spannungsbogen zwischen Tourismus und Alltag: Millionen Besucher, dazu eine lokale Bevölkerung, die den Kosmos der Plaza fortführt. Saqsaywaman und drei weitere Ruinen laufen über den Boleto Turístico Circuito I, Qorikancha ist separat, Kathedrale ebenfalls; Preise sind überprüft Nov 2026. Am Abend bleibt die Altstadt komplett lebendig: Cafes, Konditorien, Musik. Merkregel: Qorikancha und Kathedrale am Vormittag leeren Wege, Saqsaywaman am Nachmittag mit Sonne und Rückblick auf die Stadt."]
    ],
    stations:[
      ["Station 1, Plaza de Armas und Kathedrale","Die Plaza de Armas ist umgeben von Arkadenhäusern und Kirchen; zwei Kirchtürme gehören zur Kathedrale, die den Ruhm der Stadt trägt. Innen lohnt Marcos Zapata's Abendmahl-Dern, wo ein Meerschweinchenfeger auf dem Teller liegt, dazu der Goldaltar der Jesuitenkirche auf der gegenüberliegenden Seite. Eintritt Kathedrale S/ 40 ausländische Erwachsene, Studenten S/ 20, Kinder unter 9 frei; Öffnungszeit läuft 10 bis 17 Uhr. Tolles Detail: In der Kathedrale werden Bilder der Erdbeben von 1650 aufbewahrt, die der lokalen Überlieferung alle Glocken gelähmt haben sollen.","Cusco_Cathedral.jpg"],
      ["Station 2, Qorikancha","Der Qorikancha war der Reichstempel der Sonne, zerstört wurde er kaum: Die spanische Ordnung baute Santo Domingo obendrauf, und heute sieht man Inka-Mauern und Kolonialkloster im Dialog. Der Eintritt rettet S/ 20 pro Erwachsene, Kinder frei; das Museum von Qorikancha ist separater Zugang über den Boleto Turístico Circuito II. Innen beachten Sie die exakte Passgenauigkeit der Quader und die Fugenführung der Wände; der Garten des Conventos zeigt die damalige 몰placement. Wer die Anlage liest, liest hier das stärkste Bild von Kontinuität und Eroberungsthematik.","Qorikancha_Cusco.jpg"],
      ["Station 3, San Pedro und San Blas","Der San Pedro Markt läuft morgen alltags: Fleischen, Karten, Gemüse, Brot, Obst, Juices und kleine Restaurants; drei Reihen decken die Basis der lokalen Vorratskette ab. Wer bei lokalen Gerichten testen möchte, kann hier günstiges Frühstück und Mittagessen bekommen. San Blas ist das Künstlerviertel oberhalb: enge Straßenzüge, kleine Werkstätten, Cafes mit Blick über Dächer der Plaza. Ein Muss ist der Zwölfwinkel-Stein an der Calle Hatunrumiyoc, aktiv ein Inka-Mauerfragment mit zwölf sichtbaren Ecken, freier Zugang.","San_Pedro_Market.jpg"],
      ["Station 4, Saqsaywaman","Über der Stadt, rund 2 km von der Plaza, wahrt die Zickzack-Mauer von Saqsaywaman, die mächtigste Steinsammlung Perus: Blöcke von vielen Tonnen, exakt gefügt ohne Mörtel. Die Anlage war Festung oder Zeremonialbezirk, diskutiert wird beides; unstrittig ist die Rolle bei Inti Raymi, dem Sonnenfest am 24. Juni. Eintritt über Boleto Turístico Circuito I S/ 70, Öffnungszeiten 7 bis 17.30 Uhr; Rundweg rund 1,5 bis 2 Std. inkl. Q'enqo, Puka Pukara und Tambomachay.","Saqsaywaman_Walls.jpg"]
    ],
    praktisch:["Qorikancha: S/ 20 Erwachsene, bar, nicht im Boleto enthalten; Kathedrale: S/ 40 ausländische Erwachsene, 10 bis 17 Uhr.","Boleto Turístico del Cusco: Circuito I (Ruinen über der Stadt) S/ 70 für 2 Tage, integral S/ 130 für 10 Tage.","Höhe: 3.400 m am Plaza, Saqsaywaman bis 3.600 m; langsam gehen, am ersten Tag Respekt vor Alkohol und großen Planen.","Orientierung: Plaza de Armas als Zentrum, alles ist zu Fuß erreichbar; Taxis innenstadt ab S/ 5.","Zeitplan: Qorikancha und Kathedrale vormittags, Saqsaywaman-Tour nachmittags, San Pedro unabhängig vormittags fürs Frühstück."],
    sources:["salastravelperu.com: Qorikancha Guia 2026","trexperienceperu.com: Catedral del Cusco Guía","salastravelperu.com: Sacsayhuaman Guide 2026"]

    intro:[
      "Pisac liegt am Eingang des Valle Sagrado, rund 33 Kilometer von Cusco: unten der Markt-Ort auf 2.986 Metern, oben auf dem Bergrücken der archäologische Park auf rund 3.300 Metern. Die Terrassen ziehen sich in langen Bögen den Hang hinauf, darüber liegen Wohnbezirke, Tempel und der Intihuatana-Bezirk, gefolgt vom Blick ins Tal und in die Schlucht Q'allaqasa. Die Anlage zählt zur Standardroute und gehört in den Boleto Turístico del Cusco.",
      "Dieses Kapitel führt den Park von oben nach unten: vom oberen Eingang über die Mirador-Kante und den Intihuatana-Bezirk bis zum Abstieg durch die Terrassenkomplexe Richtung Ort. Wir lesen die Anlage als Höhen-Programm: religiöser Sektor oben, Wohnbezirk auf der Kante, Agrarterrassen an der Flanke. Unten folgt der Markt: Sonntags der bekannteste Tag mit Kampffaktor, sonst einfach reizender zwischen Handwerk und Sonoja."

    planStations:[

    history:[
      ["Bauzeit und Vorgeschichte","Pisac datiert in die Blütezeit der Inka, Mitte des 15. Jahrhunderts, und verbindet Agrar, Militär und Religious-en-Kult: Terrassenkomplexe an der Flanke, Wohnquartiere auf dem Kamm, ein Tempelbezirk am Intihuatana. Das Parkareal misst über 9.000 Hektaren, delimitiert 2002 und gilt als eine der besten Anlagen des Tals. Nach der Eroberung verfiel die Höhensiedlung, der Ort zog into den Talboden, und der koloniale Markt prägt bis heute die Wochenstruktur der Region."],
      ["Symbolik und Funktion","Funktion ist klassisch geschichtet: Oben der sakrale Kern mit dem Intihuatana als Kalender- und Sonnenbezug, mittig die Wohnstadt vor Wind geschützt, unten die Agrarterrasse für Maisfrucht. Der Blick von oben liest die Landschaft als Genehmigungsprinzip: Fluss, Terrasse, Kamm, Gipfel bilden eine vertikale Ordnung gleich Moray oder Ollantaytambo. Wasserkanäle und Stufenverbindungen zeigen, dass sich Wohnen und Landwirtschaft im Bereich einer heiligen Mitte begegnen: der Gipfelbezirk als Heiligtum, die Terrassen als Nahrung."],
      ["Wandel und Gegenwart","Pisac ist heute der südliche Anker des Boleto-Turístico-Circuito III und verbindet Ruinen mit Ortmarkt; 427.654 Besucher zählte die DDC Cusco 2023, nach einem Hoch 2019. Öffnungszeiten 7 bis 16.30 Uhr, Ticket S/ 70 für den 2-Tage-Circuit oder integral S/ 130. Der Sonntagsmarkt läuft als Haupt-Markttag mit echtem Tauschhandel, die anderen Tage eher touristisch; DDC restaurierte 2017 ein 300-Meter-Inka-Stück und die zwei Felsentunnel. Wer früh kommt, kann oben fast allein gehen."]

/* ------------------------------ ZUSTAND, DESIGN, VORLESEN ------------------------------ */
const LS={theme:"gid.theme",progress:"gid.progress",rate:"gid.rate",voice:"gid.voice"};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
let progress=store.get(LS.progress,{});
const themeBtn=document.getElementById("themeBtn");
function applyTheme(){
  const mode=store.get(LS.theme,"auto");
  const sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  const dark=mode==="dark"||(mode==="auto"&&sysDark);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  themeBtn.textContent=mode==="auto"?"Auto":(dark?"Dunkel":"Hell");
}
themeBtn.addEventListener("click",()=>{
  const order=["auto","light","dark"];
  const cur=store.get(LS.theme,"auto");
  store.set(LS.theme,order[(order.indexOf(cur)+1)%3]);
  applyTheme();
});
if(window.matchMedia){window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(store.get(LS.theme,"auto")==="auto")applyTheme();});}
applyTheme();
const synth=window.speechSynthesis;
let ttsQueue=[],ttsIdx=0,ttsPaused=false,rate=store.get(LS.rate,1.0),voices=[];
const ttsbar=document.getElementById("ttsbar");
document.getElementById("ttsRate").value=rate;
function loadVoices(){
  if(!synth)return;
  voices=synth.getVoices()||[];
  const sel=document.getElementById("ttsVoice");
  sel.innerHTML="";
  const pref=["de-DE","de-AT","de-CH","es-ES","es-PE","es-MX"];
  const sorted=[...voices].sort((a,b)=>{const ra=pref.indexOf(a.lang),rb=pref.indexOf(b.lang);return (ra<0?99:ra)-(rb<0?99:rb);});
  for(const v of sorted){const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o);}
  const saved=store.get(LS.voice,null);
  if(saved){for(const o of sel.options){if(o.value===saved){sel.value=saved;break;}}}
}
if(synth){synth.onvoiceschanged=loadVoices;loadVoices();}
document.getElementById("ttsVoice").addEventListener("change",e=>{store.set(LS.voice,e.target.value);});
document.getElementById("ttsRate").addEventListener("input",e=>{
  rate=parseFloat(e.target.value);document.getElementById("ttsRateVal").textContent=rate.toFixed(1)+"x";store.set(LS.rate,rate);
});
function chunkText(text){
  const parts=text.replace(/\s+/g," ").match(/[^.!?]+[.!?]+|\S.+$/g)||[text];
  const out=[];let cur="";
  for(const s of parts){if((cur+s).length>220){out.push(cur.trim());cur=s;}else{cur+=s;}}
  if(cur.trim())out.push(cur.trim());
  return out;
}
function speakNow(chunk){
  if(!synth)return;
  const u=new SpeechSynthesisUtterance(chunk);
  u.rate=rate;u.lang="de-DE";
  const sel=document.getElementById("ttsVoice");
  const v=voices.find(x=>x.name===sel.value);
  if(v){u.voice=v;u.lang=v.lang;}
  u.onend=()=>{
    if(ttsIdx<ttsQueue.length-1&&!ttsPaused){ttsIdx++;speakNow(ttsQueue[ttsIdx]);}
    else if(ttsIdx>=ttsQueue.length-1&&!ttsPaused){ttsbar.classList.remove("on");if(ttsCb&&ttsCb())window.setTimeout(()=>{},10);}
  };
  u.onerror=()=>{ttsbar.classList.remove("on");};
  synth.speak(u);
}
let ttsCb=null;
function startTTS(text,cb){
  if(!synth){alert("Vorlesen ist in diesem Browser nicht verfügbar.");return;}
  synth.cancel();
  ttsPaused=false;document.getElementById("ttsPause").textContent="Pause";
  ttsQueue=chunkText(text);ttsIdx=0;ttsCb=cb||null;
  ttsbar.classList.add("on");
  speakNow(ttsQueue[0]);
}
document.getElementById("ttsPause").addEventListener("click",()=>{
  if(!synth)return;
  if(ttsPaused){ttsPaused=false;document.getElementById("ttsPause").textContent="Pause";synth.cancel();speakNow(ttsQueue[ttsIdx]);}
  else{ttsPaused=true;synth.cancel();document.getElementById("ttsPause").textContent="Weiter";}
});
document.getElementById("ttsStop").addEventListener("click",()=>{if(synth)synth.cancel();ttsbar.classList.remove("on");ttsCb=null;});
document.getElementById("ttsPrev").addEventListener("click",()=>{if(!synth||!ttsQueue.length)return;ttsIdx=Math.max(0,ttsIdx-1);synth.cancel();speakNow(ttsQueue[ttsIdx]);});

/* ------------------------------ PROGRESS & VIEWS ------------------------------ */
function getRead(site,ch){return !!(progress[site]&&progress[site][ch]);}
function setRead(site,ch,val){if(!progress[site])progress[site]={};progress[site][ch]=val?1:false;store.set(LS.progress,progress);}
const ALL_SITES=SITES.concat(SITES2);
const app=document.getElementById("app");
const findSite=id=>ALL_SITES.find(x=>x.id===id)||null;
function chapterList(s){
  const out=[{k:"intro",label:"Überblick"}];
  if(s.planSvg)out.push({k:"plan",label:"Lageplan"});
  out.push({k:"history",label:s.historyLabel||"Geschichte"});
  if(s.stations)out.push({k:"rundgang",label:"Rundgang ("+s.stations.length+")"});
  out.push({k:"praktisch",label:"Praktisches"});
  return out;
}
function flatSeq(s){
  const out=[];
  for(const ch of chapterList(s)){
    if(ch.k==="rundgang")s.stations.forEach((st,i)=>out.push({ch:"s"+i,label:"Station "+(i+1)}));
    else out.push({ch:ch.k,label:ch.label});
  }
  return out;
}
function siteAllRead(s){
  const list=flatSeq(s);
  return list.length>0&&list.every(x=>getRead(s.id,x.ch));
}
function renderHome(){
  let html="<h2>Privater Reiseführer: Peru, Route Cusco bis Paracas</h2>";
  html+='<p class="muted">Alle Orte dieser Route, vollstaendig offline, mit Vorlesefunktion pro Kapitel und Station. Ein Design, das dem Gerät folgt und sich manuell umschalten lässt. Der Lesestand wird lokal gespeichert.</p>';
  for(const s of ALL_SITES){
    html+='<a href="javascript:void(0)" onclick="go(\''+s.id+'\',\'intro\')" class="card" style="display:block;text-decoration:none;color:inherit">'
      +'<div style="display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap"><h2 style="margin:0">'+s.name+'</h2><span class="muted">'+s.alt+'</span>'+(siteAllRead(s)?'<span class="readmark">✔ alles gelesen</span>':'')+'</div>'
      +'<div class="facts">'+s.meta.map(m=>"<span>"+m+"</span>").join("")+'</div>'
      +'<p class="muted" style="margin:.4rem 0 0">'+s.intro[0].slice(0,170)+"…</p></a>";
  }
  app.innerHTML=html;
  window.scrollTo(0,0);
}
function renderSite(id,chRaw){
  let ch=chRaw;
  const s=findSite(id);
  if(!s){renderHome();return;}
  if(ch==="plan"&&!s.planSvg)ch=s.stations?"history":"praktisch";
  if(ch.startsWith("s")&&!s.stations)ch="intro";
  if(ch==="history"&&!s.history)ch="praktisch";
  let html='<div class="sitetabs">';
  for(const t of chapterList(s)){
    const active=(t.k==="rundgang")?ch.startsWith("s"):ch===t.k;
    let read=false;
    if(t.k==="rundgang")read=s.stations.every((st,i)=>getRead(s.id,"s"+i));
    else read=getRead(s.id,t.k);
    const target=(t.k==="rundgang")?"s0":t.k;
    html+='<button class="'+(active?"active":"")+'" onclick="go(\''+s.id+'\',\''+target+'\')">'+t.label+(read?'<span class="readmark">✔</span>':'')+"</button>";
  }
  html+="</div>";
  if(s.stations&&s.stations.length){html+='<div><select class="sitemenu" onchange="go(\''+s.id+'\',this.value)"><option value="">Stationen wählen …</option>'+s.stations.map((st,i)=>'<option value="s'+i+'">'+st[0]+"</option>").join("")+"</select></div>";}
  html+='<h2>'+s.name+' <span class="muted" style="font-size:.85rem">'+s.alt+"</span></h2>";
  if(ch==="intro"){
    html+='<div class="card">'+s.intro.map(p=>"<p>"+p+"</p>").join("")+'<div class="facts">'+s.meta.map(m=>"<span>"+m+"</span>").join("")+"</div></div>";
    const nextCh=s.planSvg?"plan":(s.stations?"history":"praktisch");
    html+='<div class="navrow"><button class="primary" onclick="go(\''+s.id+'\',\''+nextCh+'\')">Weiter →</button><button onclick="goHome()">← Übersicht</button></div>';
  }else if(ch==="plan"){
    html+='<div class="card">'+s.planSvg+'</div><p class="muted">'+s.planNote+"</p>";
    html+='<div class="card"><strong>Stationen im Plan</strong><ol>'+s.planStations.map(st=>"<li><strong>"+st[0]+":</strong> "+st[1]+"</li>").join("")+"</ol></div>";
    html+='<div class="navrow"><button class="primary" onclick="go(\''+s.id+'\',\''+(s.planSvg?'plan':'praktisch')+'\')">Rundgang starten →</button><button onclick="go(\''+s.id+'\',\'intro\')">← Überblick</button></div>';
  }else if(ch==="history"){
    html+='<div class="card">'+s.history.map(h=>"<h3>"+h[0]+"</h3><p>"+h[1]+"</p>").join("")+"</div>";
    html+='<div class="navrow"><button class="primary" onclick="go(\''+s.id+'\',\''+(s.stations?'s0':'praktisch')+'\')">Zum Rundgang →</button>'+(s.planSvg?'<button onclick="go(\''+s.id+'\',\'plan\')">← Lageplan</button>':'')+'</div>';
  }else if(ch==="praktisch"){
    html+='<div class="card"><ul>'+s.praktisch.map(p=>"<li>"+p+"</li>").join("")+'</ul><details><summary>Quellen</summary><ul class="sourcebox">'+s.sources.map(x=>"<li>"+x+"</li>").join("")+"</ul></details></div>";
    html+='<div class="navrow">'+(s.planSvg?'<button onclick="go(\''+s.id+'\',\'plan\')">← Lageplan</button>':'')+'<button class="primary" onclick="goHome()">Übersicht →</button></div>';
  }else if(ch.startsWith("s")){
    const i=parseInt(ch.slice(1));const st=s.stations[i];
    html+='<div class="card"><div style="display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap"><span class="nr">'+(i+1)+'</span><h3 style="margin:0">'+st[0]+"</h3></div><p>"+st[1]+"</p>"+(st[2]?'<img class="stimg" loading="lazy" alt="'+st[0]+'" src="https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(st[2])+'?width=900" onerror="this.style.display=\'none\'">':"")+"</div>";
    html+='<div class="navrow">'
      +(i>0?'<button onclick="go(\''+s.id+'\',\'s\'+(i-1))">← Vorherige</button>':"")
      +'<button class="primary" onclick="go(\''+s.id+'\',\'s\'+Math.min(s.stations.length-1,i+1))">Nächste →</button></div>';
  }
  const seq=flatSeq(s);const idx=seq.findIndex(x=>x.ch===ch);const nextIdx=idx+1;
  const readNow=getRead(s.id,ch);
  html+='<div class="navrow">'
    +'<button id="readBtn" class="small'+(readNow?" primary":"")+'">'+(readNow?"✔ Gelesen":"Als gelesen markieren")+"</button>"
    +'<button id="speakBtn" class="small">🔊 Vorlesen</button>'
    +(ch.startsWith("s")?'<button id="speakTour" class="small" title="Alle Stationen ab hier vorlesen">🔊 Rundgang ab hier</button>':"")
    +"</div>";
  if(idx>=0&&nextIdx<seq.length){html+='<div class="navrow"><button onclick="go(\''+s.id+'\',\''+seq[nextIdx].ch+'\')">Weiter: '+seq[nextIdx].label+" →</button></div>";}
  app.innerHTML=html;
  document.getElementById("readBtn").onclick=()=>{setRead(s.id,ch,!readNow);renderSite(s.id,ch);};
  const collectText=()=>{
    if(ch==="intro")return s.intro.join(" ");
    if(ch==="plan")return s.planStations.map(x=>x[0]+": "+x[1]).join(". ");
    if(ch==="history")return s.history.map(h=>h[0]+". "+h[1]).join(". ");
    if(ch==="praktisch")return s.praktisch.join(". ");
    if(ch.startsWith("s")){const i=parseInt(ch.slice(1));return s.stations[i][0]+". "+s.stations[i][1];}
    return "";
  };
  document.getElementById("speakBtn").onclick=()=>{
    startTTS(collectText(),()=>{
      if(!ch.startsWith("s"))return true;
      const i=parseInt(ch.slice(1));
      if(i<s.stations.length-1){setRead(s.id,ch,true);go(s.id,"s"+(i+1));return false;}
      setRead(s.id,ch,true);return true;
    });
  };
  const tourBtn=document.getElementById("speakTour");
  if(tourBtn)tourBtn.onclick=()=>{
    let i=parseInt(ch.slice(1));
    const step=()=>{
      if(i>=s.stations.length){ttsbar.classList.remove("on");return;}
      const st=s.stations[i];
      renderSite(s.id,"s"+i);
      setTimeout(()=>{startTTS(st[0]+". "+st[1],()=>{setRead(s.id,"s"+i,true);i++;return true;});},400);
    };
    step();
  };
  window.scrollTo(0,0);
}
let curSite=null,curCh="intro";
function goHome(){curSite=null;curCh="intro";renderHome();}
function go(id,ch){curSite=id;curCh=ch;renderSite(id,ch);}
function router(){
  const h=location.hash.replace(/^#\//,"");
  if(!h){goHome();return;}
  const parts=h.split("/");
  const s=findSite(decodeURIComponent(parts[0]));
  if(!s){goHome();return;}
  renderSite(s.id,parts[1]?decodeURIComponent(parts[1]):"intro");
}
document.querySelector(".brand").addEventListener("click",goHome);
window.addEventListener("hashchange",router);
try{if(location.hash&&location.hash.indexOf("#/")===0)router();else goHome();}catch(e){goHome();}
</script>
</body>
