    intro:[
      "Herzlich willkommen im Valle Sagrado, dem Nährboden des Inka-Reiches. Der Fluss Vilcanota, den die Kolonialzeit Urubamba taufte, zieht sich zwischen Chinchero, Maras, Urubamba und Ollantaytambo durch ein Tal mit mildem Klima, fruchtbaren Böden und der dichtesten Folge von Inka-Stätten in ganz Peru. Besiedelt war das Tal lange vor den Inka; unter Pachacútec und Túpac Yupanqui wurde es im 15. Jahrhundert zum königlichen Kernland. Mais aus den Terrassen am Fluss ernährte die Hauptstadt, königliche Güter beanspruchten die besten Lagen, und Seitentäler wie das Patacancha-Tal wurden bewässert und vollständig terrassiert. Wer Tage hier verbringt, sieht jeden Tag Baumeisterarbeit.",
      "Dieses Kapitel ist eine Orientierungshilfe: Es erklärt, wie die Orte dieses Abschnitts zusammenhängen, welche Tickets gelten und wie sich die Tage sinnvoll aufbauen lassen. Die Geografie liest sich dabei wie ein Inka-Programm. Der Fluss galt als Abbild der Milchstraße und hieß Willkamayu, die Berge als Apus. Moray war das Klimlabor der Agrarverwaltung, Ollantaytambo Residenz und Festung, Maras lieferte das Salz, Chinchero die Textiltradition. Danach folgen im Menü Moray, die Salinas de Maras, Ollantaytambo und die Perolniyoc-Route als eigene Halbtage. Planen Sie Autofahrten und Mittagslicht zwischen den Orten ein, weil die Pässe eng sind und die Restaurants früh schließen."

    history:[
      ["Bauzeit und Vorgeschichte","Archäologisch ist das Tal bis in die Wari-Zeit und früher belegt; die Inka übernahmen bestehende Siedlungsräume und formten sie imperial um. Ab den 1440er-Jahren entstanden unter Pachacútec die königlichen Anlagen: Ollantaytambo als geplante Residenzstadt am Fluss, Moray als Experimentierfeld auf der Hochfläche. Bewässerungskanäle und Terrassen zogen die Landwirtschaft in Höhenlagen hinauf, die vorher ungenutzt blieben. Das Tal war kein Grenzland, sondern Kornkammer und Adelslandschaft zugleich, und die besten Lagen gehörten den Panacas, den Erbverbänden der verstorbenen Herrscher. Wer genau hinsieht, erkennt bis heute die Arbeitsteilung des Reiches: unten Mais, oben Salz, zwischen Rinnsal und Ackerbau ein Netz aus Speichern, Kanälen und Kleinorten."],
      ["Symbolik und Funktion","Für die Inka war eine Landschaft nie nur Fläche, sondern Verwandtschaftssystem: Der Fluss spiegelte die Milchstraße, die Gipfel waren Ahnen als Apus, Quellen wurden gehegt und gepflegt wie Haushaltsmitglieder. Genau deshalb lohnt der Blick auf die Bauweise: Bewässerung, Terrassierung und Sieltunnel sind Technik und Theologie in einem. Wer im Tal wandert, bewegt sich durch ein geordnetes Kosmos-Modell mit verschiedenen Höhenschichten: unten Mais auf frischem Ackerboden, oben Salz und Steppenland, und dazwischen die Wohnquartiere der städtischen Elite. Diese horizontale und vertikale Ordnung macht das Tal zum Abbild der Inka-Gesellschaft im Kleinen: jede Schicht hat ihren Ort, jeder Ort seine Aufgabe im größeren Kontext des Reiches."],
      ["Kolonialzeit und Wandel","Nach der Eroberung wurden Encomiendas über das Tal gelegt, Kolonialorte entstanden mit Kirchen auf Inka-Mauern und Encaje-Portalen, und der wirtschaftliche Reichtum wanderte nach Lima, was das Tal strukturell verarmen ließ. Geblieben sind die Inka-Straßen und die Grundrisse, was heute das Zweite lehrreich am Tal ist: Der Grundriss von Ollantaytambo und die Feldfluren zeigen die Planstärke der Inka besser als jede Karte. Heute ist das Tal der meistbesuchte Korridor Perus, und ohne Tagesplan verliert man sich in einem der Busströme, die Chinchero mit Urubamba verbinden. Die Familien haben sich darauf eingestellt: Werkstätten, kleine Restaurants und Ateliers sind entstanden, meist nahe der Straßen, wo Gruppen anhalten und kurz verstehen wollen, was hier geschieht."]

    praktisch:["Ticket: Moray und Ollantaytambo laufen über den Boleto Turístico del Cusco, Circuit III S/ 70 für 2 Tage (inklusive Pisac, Chinchero, Moray, Ollantaytambo) oder integral S/ 130 für 10 Tage. Die Salinas de Maras kosten separat S/ 20 in bar, verwaltet von der Gemeinschaft.","Anfahrt: von Cusco per Colectivo nach Urubamba oder Ollantaytambo, Taxis zwischen den Orten kosten rund S/ 10 bis 25; für Moray und Maras braucht man ein Fahrzeug bis zur Hochfläche.","Höhe und Klima: 2.700 bis 3.000 m, spürbar tiefer und wärmer als Cusco, mittags starke Sonne, nachts kalt.","Merkregel: Nicht alles an einem Tag. Bewährt: Tag A Chinchero, Moray, Maras; Tag B Ollantaytambo und Perolniyoc.","Basis: Urubamba für Ruhe und Taxianbindungen, Ollantaytambo für Bahnhof und frühen Start."],

    intro:[
      "Moray liegt auf der kühlen Hochfläche zwischen Chinchero und dem Tal und sieht aus wie ein Amphitheater, das von Händen in die Erde gesenkt wurde: konzentrische Ringterrassen um eine vertiefte Mitte, satt grün gegen die braune Hochfläche. Die Anlage entstand vermutlich im 15. Jahrhundert unter Pachacútec und wurde unter seinen Nachfolgern erweitert; am Rand liegt der Nebensektor Cheqoq. Eine Festung war Moray nie, auch ein Wohnort nicht: Es ist reine Ingenieurs- und Zeremonialarchitektur, geplant wie ein Instrument, dessen Zeiger die Temperatur sind. Auch die Bauweise ist sichtbar: Feldstein unten, polierte Obermauern oben.",
      "In diesem Kapitel gehen wir den Beckenrand ab und lesen die Terrassen als Klimaskala. Jede Stufe erzeugt ein eigenes Mikroklima, messbar mit Temperaturunterschieden von etwa 5 bis 6 Grad zwischen unterster und oberster Ebene. Genau darin lag die Funktion: Saatgut aus verschiedenen Regionen ließ sich hier unter kontrollierten Bedingungen kultivieren, bevor es in der Hochebene ausgebracht wurde. War Moray ein Agrar-Labor, ein Ritualort der Fruchtbarkeit oder beides zugleich? Diese Deutung ist heute Standard, gestützt vor allem auf die Funktionsnachweise von Kanälen und Drainagen. Praktisch ist der Besuch gut kombinierbar: Am Vormittag leere Wege, flaches Licht, nach einer Stunde geht es weiter zu den Salinas oder zurück nach Urubamba."

    history:[
      ["Bauzeit und Vorgeschichte","Moray datiert ins 15. Jahrhundert, die Hauptbauphase fällt unter Pachacútec und Túpac Yupanqui, spätere Nachträge unter Huayna Cápac sind möglich. Am Rand liegt der Nebensektor Cheqoq, eine offene Fläche mit ähnlicher Terrassenstudie. Fertiggebaut wurde das Konzept nie vollständig: Teilbereiche blieben unvollendet, was darauf hindeutet, dass die Inka hier dauerhaft über Jahreszyklen hinweg arbeiteten. Die Anlage war nie bewohnt und nie befestigt; Wasserkanäle und Drainagen zeigen aber, dass hier über Jahre und Anbausaisons gearbeitet wurde, nicht für Besucher. Bauherr nennt die Forschung den Staat, ausgeführt von Arbeitsgruppen der Regionen, die dem Reich abgabenpflichtig waren; so wird Moray zu einem sehr frühen Bild staatlicher Forschungsinfrastruktur in den Anden."],
      ["Symbolik und Funktion","Das Kernergebnis der Forschung: Jede Terrassenebene schafft einen anderen Temperaturstreifen, mit messbaren Sprüngen von rund 5 bis 6 Grad zwischen unten und oben, weil die Schüssel Luft wie ein Backofen hält. Die Inka haben damit Saatgut sortiert und systematisch gehärtet, bevor es die Regionen verließen. Dazu kommt der rituelle Schatten: Wasser, Erde und Himmel werden in Höhenschichten gegliedert, und die Zentrumsform lässt an ein Kalender-Orientierungssystem denken. Nicht zuletzt funktionierte die Drainage so gut, dass die Becken nach Regen trocken blieben statt zu versumpfen. Man liest die Anlage deshalb am besten als Doppelfunktion: Labor und Bühne, Versuchsstation und zeremonieller Ort, in einem Bauwerk, dessen Form bis heute trägt."],
      ["Wandel und Gegenwart","Moray versank nach der Eroberung in Vergessenheit, bis Luftaufnahmen in den 1930er-Jahren die Kreise in den Feldern zeigten. Systematische Grabungen begannen erst in den 1990er-Jahren, unter anderem durch den Agrarökologen John Earls, der die Temperaturmessungen beisteuerte. Heute gehört Moray zum Boleto Turístico und ist nach Machu Picchu das bekannteste Motiv der Region; die Restaurierung schreitet schrittweise voran, das Absteigen in die Becken ist verboten, um die Terrassen zu schonen. Die Verwaltung plant mehr Zugangskontrolle, Wege bleiben schmal, und die Erfahrung ist trotzdem stark: Wer früh kommt und den Rand abläuft, hat die Anlage weitgehend allein und kann ihre Geometrie als Bild aufnehmen."],
      ["Prüflesung vor Ort","Beim Rundgang lohnt ein Blick auf drei Details: die schmalen Treppen zwischen den Ringen, die eher Wartungs- und Kontrollwege dienten; die Drainagekanäle, die noch heute Wasser nach unten leiten; und die Bodenqualität, die sich von Ring zu Ring visuell verschiebt. Wenn Sie die Sonne niedrig stehen lassen, erkennen Sie die Ringschatten als Schattierungen auf der Schüssel: genau dieser Effekt machte die Messbarkeit der Ebenen aus. Ohne Schattenmessgerät liest sich Moray trotzdem als getreues Zeitkapitel der Inka-Technik, denn Form und Funktion liegen hier so nah beieinander, dass der bloße Blick schon genügt. Wer Zeit hat, wartet eine halbe Stunde am Rand und sieht die Schatten langsam die Ringe überlaufen."]

    stations:[
      ["Station 1, Eingang und Parkplatz","Sie kommen auf der offenen Hochfläche an, die Terrassenschüssel liegt als grüner Trichter vor Ihnen. Das Ticket wird am Häuschen geprüft, Toiletten und Informationstafeln liegen rechts. Nehmen Sie sich einen Moment vor dem ersten Blick: Die Wirkung von Moray entsteht aus dem Kontrast zwischen der trockenen, grau-grünen Fläche um Sie herum und der saftig grünen Konzentration im Boden. Die Maße: Die Hauptgrube misst auf der langen Achse rund 130 Meter, ihre Terrassen fallen insgesamt etwa 30 Meter tief. Vom Eingang führt der Weg nach links an der Außenkante entlang, und Sie sollten ihn behutsam nehmen, denn die Hochfläche ist windig, und der Wechsel von der wärmeren Talsohle ist sofort spürbar.","Moray,_Peru.jpg"],
      ["Station 2, Mirador am Hauptbecken","Gehen Sie an der Westkante, bis sich das große Becken ganz öffnet. Zählen Sie die Stufen und achten Sie auf die schmalen Treppen, die einzelne Ringe verbinden: Sie sind so eng, dass sie eher Kontroll- und Wartungswegen dienten als Besichtigungsrouten. Schauen Sie auf die Mauern: Hinter den Feldsteinmauern liegt ein Schotterkern, der Wasser ableitet, damit die Stufen im Regen nicht auseinanderfrieren. Der Blick geht über die volle Schüssel: unten das feuchte Grün der tiefen Stufen, oben das trockene Grau. Hier verstehen Sie Moray am besten: Landschaft als Bauwerk, streng wie eine Maschine. Fotografisch ist der Morgen die beste Zeit; am Nachmittag reflektiert das Weiß so stark, dass Kontrast verloren geht.","Moray,_Sacred_Valley,_Peru.jpg"],
      ["Station 3, Beckenblick von Nordost","Am gegenüberliegenden Rand öffnet sich der Blick über die Becken hinaus zu den Bergen im Süden. Von hier sieht man gut, dass die Ebenen nicht nur landwirtschaftlich gedacht waren: Die unterste Ebene ist fast kreisrund wie eine Bühne, mit Wasserkanälen im Kalk. Der Nutzen von Moray gründet in seiner Geometrie: Rundform hält gleichmäßige Sonnenlast, Tiefe hält Wärme, Anordnung erlaubt vergleichende Versuche auf engem Raum. Wenn Sie Ort und Morgenlicht kombinieren, sehen Sie die Stufen als Schattierungskala: unten dunkel und feucht, oben hell und trocken, dazwischen die messbaren Klimazonen. Ergänzen Sie diesen Blick mit der Frage: Wer würde hier stehen und was beobachten? Dann wird die Anlage im Kopf zum Labor.","Moray_rings.jpg"],
      ["Station 4, Becken 3","Östlich der Hauptgrube liegt eine zweite, kleinere Senke, teils zerfallen. Hier zeigt sich der Zustand vor Restaurierung, was oft lehrreicher ist als der Restaurationsglanz: Grob behauene Blöcke vor Schotterkern, Mauern ohne Zement, Ringe, die nicht mehr ganz rund sind. Genau diese Bauweise aber übersteht Erdbeben, weil Lasten untereinander arbeiten können statt ein starres System zu bilden. Vergleichen Sie beide Becken: Die Hauptgrube hat die Ringe in einen Trichter gearbeitet, Becken 3 bleibt flacher, einfacher, eher Versuchsparzelle als Schauspiel. Hier sieht man das System in Arbeit, nicht die Show. Wenn Sie nach Becken 3 noch Zeit haben, lohnt der Blick nach Osten zu den Feldern, denn dort setzt sich die Terrassentechnik im Kleinformat fort.","Moray_secondary_basin.jpg"],
      ["Station 5, Rückweg Richtung Maras","Der Rückweg führt über die Hochfläche. Mit Zeit und Taxi geht der Ausgang Richtung Maras, sonst laufen Sie zurück zur Straße. Der Blick zurück zeigt die Kreise als konzentrische Bänder zwischen den Feldern, so sah sie vermutlich auch der Landvermesser der Inka. Wer noch Zeit hat, kann den Rand nach Süden auslaufen: dort liegt der Nebensektor Cheqoq, eine offene Terrassenfläche, die zeigt, dass Moray kein isoliertes Wunder war, sondern der Mittelpunkt eines Feldversuch-Verbundes. Wenn der Wind auffrischt, merken Sie es: Diese Hochfläche war nie bequem, sie war nötig. Wer für die Salinas weiterfährt, spart hier die Rücktour, wenn der Fahrer bereit ist; sonst geht es zurück zur Straße mit Blick auf die Feldfluren.","Moray_aerial.jpg"]

    intro:[
      "Die Salinas de Maras sind kein Museum, sondern eine funktionierende Saline: Tausende kleine Becken prägen als weiße Staffel die Flanke eines Seitentals über dem Vilcanota und werden bis heute von Familien der Gemeinden Maras und Pichingoto mit der Hand abgearbeitet. Die Anlage ist älter als die Inka; ein hypersaliner Quellaustritt am Hangkopf speist seit Jahrhunderten dasselbe Kanalnetz, das jede Entnahmezone einzeln versorgt. Salz galt als Regal und Handels- und Ritualgut, und der Wert steckt bis heute in den Becken: Jede Fläche gehört einer Familie. Wer sie sieht, versteht, dass die Saline nicht hergestellt, sondern gehütet wird.",
      "Wir gehen in diesem Kapitel vom Mirador aus dem Wasser nach: von der Quelle am Hangkopf über den Hauptkanal bis zur Ernte in den Becken-Mittellagen. Betreten dürfen Sie die Becken selbst seit 2019 nicht mehr, beobachten können Sie trotzdem alles: Wie Wasser in Becken mit rund 5 cm Säule läuft, in rund drei Tagen verdunstet und nach einem Zyklus von etwa einem Monat zur gestochenen Kruste wird. Sie sehen Salz, wie es entsteht, nicht wie es gelagert wird. Falls Sie fotografieren wollen, nutzen Sie das Licht am Morgen und Nachmittag, nicht die harte Mittagssonne, die das Weiß schneidend macht und die Beckenprofile verschluckt."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#e9e4d8"/><polygon points="0,60 720,20 720,0 0,40" fill="#b9b39e"/><path d="M80,40 C260,120 420,200 620,330" fill="none" stroke="#d8d0b8" stroke-width="140" opacity="0.9"/><g stroke="#a8967d" stroke-width="2"><line x1="140" y1="120" x2="240" y2="90"/><line x1="170" y1="160" x2="290" y2="120"/><line x1="210" y1="210" x2="350" y2="160"/><line x1="260" y1="260" x2="420" y2="200"/><line x1="330" y1="300" x2="500" y2="250"/><line x1="410" y1="330" x2="570" y2="300"/></g><text x="430" y="250" font-size="13" fill="#3b4652">Beckenstaffel</text><circle cx="95" cy="55" r="7" fill="#6f9fb8"/><text x="40" y="80" font-size="12" fill="#3b4652">Salzwasserquelle</text><path d="M95,55 C180,110 260,160 320,210" stroke="#6f9fb8" fill="none" stroke-width="3"/><rect x="40" y="330" width="80" height="18" rx="4" fill="#6f5c4b"/><text x="34" y="368" font-size="12" fill="#3b4652">Mirador-Eingang</text><g font-size="14" font-weight="bold"><circle cx="80" cy="330" r="12" fill="#3b4652"/><text x="80" y="335" fill="#fff" text-anchor="middle">1</text><circle cx="240" cy="140" r="12" fill="#3b4652"/><text x="240" y="145" fill="#fff" text-anchor="middle">2</text><circle cx="410" cy="252" r="12" fill="#3b4652"/><text x="410" y="257" fill="#fff" text-anchor="middle">3</text><circle cx="520" cy="200" r="12" fill="#3b4652"/><text x="520" y="205" fill="#fff" text-anchor="middle">4</text><circle cx="620" cy="320" r="12" fill="#3b4652"/><text x="620" y="325" fill="#fff" text-anchor="middle">5</text></g><g font-size="18" font-weight="bold" fill="#3b4652"><text x="686" y="384">N</text></g></svg>',

    history:[
      ["Vorgeschichte und Inka","Die Salinen sind älter als die Inka und wurden schon in vorspanischer Zeit systematisch genutzt; die archäologischen Beweise liegen in der Systematik der Beckenfluren selbst. Die Inka integrierten die Saline in ihre Güterordnung: Salz war ein Regal, dessen Austrieb kontrolliert wurde, und die Burg von Maras als Zentrum der Verwaltung lässt darauf schließen, dass hier Einnahmen und Kontrolle zusammenliefen. Das Quellwasser ist geologisch interessant: Die Salze stammen aus Meeresablagerungen in den Anden, die das Grundwasser beim Aufstieg löst, wodurch dieselbe Quelle seit Jahrhunderten dasselbe trübe Rinnsal liefert. Wer den Boden genau betrachtet, sieht, dass die Becken sich nicht geplant, sondern über Generationen gewachsen sind, an die Topografie angepasst wie ein Feld, das sich Stufe um Stufe seine eigene Form erarbeitet."],
      ["Funktion und Symbolik","Die Anlage ist keine Industrie, sondern gelebtes Erbrecht: Jede Entnahmezone gehört einer Familie der Gemeinden Maras und Pichingoto, die Kanten werden über Generationen gepflegt, und diese Patchwork-Wirtschaft hält die Flanke mechanisch stabil. In der Andenwelt hat Salz eine doppelte Rolle: Lebensmittel und Ritualgut, austauschbar gegen Mais, Textilien und Arbeitskraft. Das spiegelt sich in der Technik: Rund 5 cm Wassersäule pro Becken, etwa drei Tage Verdunstung, rund ein Monat Zyklus, dann wird die 7 bis 10 cm dicke Kruste gestochen. Die UNESCO nahm die Salineras 2019 auf die Tentativliste Perus. Die Arbeit erfordert Präzision und Körperkraft, und wer sie beobachtet, versteht, dass die Schönheit der Becken nie Selbstzweck war, sondern das Nebenergebnis einer arbeitsintensiven Praxis, die Generationen erhalten haben."],
      ["Wandel und Gegenwart","Seit 2019 ist das Betreten der Becken verboten: Hautcreme, Schmutz und Abrieb der Schuhe verunreinigen die künftige Ernte im Becken. Der Besuch läuft jetzt vom Mirador. Beachten Sie den Lichtmoment: In der Trockenzeit (Mai bis Oktober) ist die Ernte weiß bis rosafarben und die Becken spiegeln scharf; in der Regenzeit ist die Ernte bräunlich und die Staffel wird dunkler. Die Familien behalten heute mehr Kontrolle denn je: Preis, Öffnungszeiten und Zugang sind lokale Entscheidungen, keine Staatskasse. Wer den Familien nicht beim Arbeiten im Weg steht, wird freundlich empfangen, und wer fragt, erhält eine kleine Erklärung. Der Besuch bleibt damit ein Blick in einen Arbeitsalltag, nicht in ein gewöhnliches Museum; genau das ist die Stärke des Ortes."]
    ],
    stations:[
      ["Station 1, Eingang und Kasse","Vom Parkplatz nahe der Straße fällt der Blick schon in die weiße Beckenstaffel. Bezahlen Sie kurz und behalten Sie den Bon; hier ist die Gemeinde unterwegs, kein Staatsbetrieb, und die Gebühr unterhält Wege, Mirador und Toiletten. Nehmen Sie Zeit bis zum Rand: Der erste Blick ist der weiteste, danach konzentrieren Sie sich auf Details. Wichtiger Hinweis: Die Flanke ist offen und windig, uv-intensiv; besonders am Morgen ist das Licht weich, und die Becken spiegeln die Helle des Himmels, was die beste Fotozeit liefert. Bringen Sie Kleingeld mit, denn die Community-Kasse nimmt nur Bargeld, und der Verkauf von Salz und Produkten vor Ort läuft ebenfalls bar.","Salinas_de_Maras.jpg"],
      ["Station 2, Mirador am oberen Rand","Der Weg am Hangrand öffnet die Spannweite: Tausende rechteckige Becken, terrassenweise in ein Seitental hinein, ohne zwei gleiche Maße. Bei Mittagsonne leuchtet das Weiß schneidend, am Morgen und Abend rosé. Bemerkenswert ist die Systematik: Die Becken sind nicht geplant, sondern gewachsen, jede Leiste an die Topografie angepasst. Wer genau schaut, erkennt kleine Kanalöffnungen am Rand, mit denen die Familien Wasser pro Becken halten oder ablassen; diese individuellen Regulierungspunkte sind der Schlüssel zur Anlage. Der Mirador ist breit, aber ohne Geländer, Kinder gut festhalten. Genau dieser oberste Punkt macht die Logik der ganzen Anlage sichtbar: Wasser von oben, Krusten unten, und jede Familie hat ihren eigenen Ausschnitt dieser Flanke, den sie Haus nennt.","Maras_salt_ponds.jpg"],
      ["Station 3, Hauptwasserkanal","Folgen Sie dem Hauptkanal ein Stück hangaufwärts: Hier tritt die Salzwasserquelle aus, seit Jahrhunderten dasselbe Rinnsal, das die Becken füttert. Der Kanal ist eingetieft und kalkig verkrustet, an den Rändern sieht man hellrosa Salzkrusten; genau dieses Sediment zeigt Ihnen die Arbeit, die die Becken unten leisten. Das Prinzip: Wasser läuft über Rinnsal und Ableitungen in die Becken, wo die Sonne die Arbeit macht. Die Sonne bricht seltener durch, als man denkt: konzentrieren Sie sich auf den Geruch, ein leichtes Hauchen von Schwere und mineralischer Kante, das in der Saline unverwechselbar präsent bleibt. Der Fußweg zum Kanal ist kurz, und Sie können den Temperaturunterschied zwischen Flanke und Talsohle auf einem zehnminütigen Gehweg spüren.","Maras_water_channel.jpg"],
      ["Station 4, Beckenstaffel Mitte","Von der Mitte des Miradors sieht man Arbeiterfamilien in den Becken: Beine im Wasser, Kratzer in der Hand, von Schicht zu Schicht, den Blick nach unten in die Kruste. Wer Beobachtungszeit investiert, versteht das Prinzip: Der Kanal hängt über den Becken, jedes Becken wird einzeln geöffnet, gefüllt und geschlossen. Die Familien tragen die Krusten in Körben hinauf, getrocknet und mit Lasttieren abtransportiert. Am Morgen sieht man Becken mit ruhigem Wasser, abends leere Becken: genau dieser Zeitdruck war einst die Ursache des Patents. Sie bleiben auf dem Weg, sind aber nah dran. Fragt man, lassen die Familien oft ein Wort über den Preis fallen; Salz ist billig, Arbeit nicht, und genau dieser Kontrast ist der eigentliche Kommentar zum Ort.","Salt_harvesting_Maras.jpg"],
      ["Station 5, Talboden","Der Abstieg endet am Fluss, unten liegt Pichingoto mit dem engen Durchgang zwischen Fels und Wasser. Von hier ist die Rückfahrt Richtung Urubamba kürzer als zurück nach oben, und die Gemeinde entscheidet, ob der Durchgang offen ist. Von unten zeigt sich die Staffel als die klassische Totale dieses Ortes: Weiße Terrassen über dem dunklen Fluss, oben die Quelle unsichtbar, dazwischen die feinen Regenbögen der Kanten. Achtung im Gegenlicht: Die Flanke ist hell, die Straße unten schattig, der Höhenunterschied ist auf dem Rückweg spürbar. Die Staffel von unten sieht aus wie eine gewaltige Bergwand, halb Substanz, halb Wolke, und genau dieses Bild bleibt Reisenden am längsten im Kopf.","Pichingoto_village.jpg"]
    ],
    praktisch:["Ticket: S/ 20 pro Person in bar, Community-Tarif der Gemeinden Maras und Pichingoto, nicht im Boleto Turístico; kein Betreten der Becken mehr, Besuch nur von den Miradors.","Öffnungszeiten: rund 08:00 bis 17:00 Uhr, morgens leer und in weichem Licht; Tarif und Zeiten sind kommunale Entscheidung, mehrfach geändert.","Anfahrt: von Urubamba oder Cusco nach Maras (Dorf), dann Taxi oder ATV-Tour; Abstieg nach Pichingoto spart einen Teil der Rückfahrt Richtung Tal.","Kombination: ideal mit Moray am selben Vormittag, beide zusammen in einem Halbtagsprogramm gut erreichbar.","Kleidung: helle Sonne, spiegelnde Flächen, windige Flanke: Sonnenbrille, Hut und fester, rutschfester Schuh	sind Pflicht."],
    sources:["salastravelperu.com: Moray und Salineras Guide (Stand Nov 2026)","enperu.org: Maras Salt Mines Guide 2026","peru-spirit.com: Salineras Guide (Mirador-Regeln)"]

    intro:[
      "Ollantaytambo ist zweierlei zugleich: eine dramatische Tempelfestung über dem Fluss und die einzige Altstadt Perus, die noch im originalen Inka-Stadtplan bewohnt wird. Die Anlage wurde unter Pachacútec Mitte des 15. Jahrhunderts als königliche Residenz geplant, unter Túpac Yupanqui erweitert und nie vollendet; benannt ist der Ort nach dem General Ollanta, der hier seine Residenz hatte. Die meisten Reisenden gönnen dem Ort den Status eines Bahnhofs an der Machu-Picchu-Linie und übersehen damit die lebendigste Inka-Anlage des Tals. Wer abends bleibt, sieht die Region entspannt: Märkte, Cervecerías und kleine Ateliers zwischen Inka-Mauern und enger Gasse, beides eng verflochten.",
      "Der Rundgang steigt über die Pumatallis-Terrassen zum unvollendeten Sonnen-Tempel, geht an Inka Watana vorbei zurück durch die Wohnquartiere zum Baño de la Ñusta, und endet optional auf dem freien Aufstieg zu den Pinkuylluna-Speichern am Gegenhang. Wer noch Zeit hat, kommt über die Perolniyoc-Route (eigenes Kapitel) zurück ins Tal. Rechnen Sie mit 1,5 bis 2,5 Stunden für den befestigten Rundgang und zusätzlich rund 90 Minuten für Pinkuylluna, idealerweise am frühen Morgen vor den Busgruppen. Danach ist die Altstadt mit ihrem Schachbrettplan, ihrem Kanalnetz und ihren Cafés der entspannte Abschluss, bevor der Zug oder das Taxi weiterzieht."
    ],

/><text x="440" y="201" fill="#fff" text-anchor="middle">6</text></g><g font-size="18" font-weight="bold" fill="#3b4652"><text x="686" y="24">N</text></g></svg>',
    planNote:"Schematisch: links die Altstadt, in der Mitte der Treppenaufstieg über die Pumatallis zum Sonnen-Tempel rechts oben; der freie Aufstieg zu den Pinkuylluna-Speichern liegt nördlich schräg gegenüber.",

    history:[
      ["Bauzeit und Vorgeschichte","Die Anlage datiert in die Regierungszeit Pachacútecs, also die Mitte des 15. Jahrhunderts, und wurde unter Túpac Yupanqui ausgeführt und ausgebaut; der ursprüngliche Plan sah eine königliche Residenz mit Tempelkomplex und geplanter Stadt darunter vor. Der Bauabbruch kam ohne Vorbereitung: Auf dem Zugangsweg liegen bis heute die verfrachteten Steinblöcke, die nie eingebaut wurden. Benannt ist der Ort nach dem General Ollanta; der Charakter des Ortes bleibt umstritten zwischen Residenz und Festung, Archäologie liest beides als verschiedene Bauphasen. Die geplante Stadt darunter ist bis heute ein architekturhistorischer Sonderfall: Ein Schachbrettplan, gebaut auf Inka-Kanälen, noch heute bewohnt, ohne dass die Originalstruktur gebrochen wurde. Deshalb bleibt Ollantaytambo der beste Einstieg in die Logik einer Inka-Residenzstadt."],
      ["Symbolik und Funktion","Funktion liest sich hier als dreifache Architektur: Wasser, Macht, Vorrat. Die Altstadt ist kanalisiert, das Kanalnetz läuft bis heute in den unveränderten Inka-Grundrissen, und im Kern liegt der Baño de la Ñusta. Das Sonnen-Tempel-Plateau über den Pumatallis zeigt rituelle Steinmetzkunst aus 50-Tonnen-Blöcken, deren Steinbrüche am gegenüberliegenden Bergrücken auf rund 4.000 m liegen; die Blöcke wurden über Rampen und eine Rutsche über den Fluss hin oben bewegt. Die Pinkuylluna-Speicher am Gegenhang stehen bewusst hoch und windoffen, dabei sichtbar: Der Zustand des Vorrates war eine öffentliche Ansage. Wer diese drei Funktionen verstanden hat, sieht die Anlage nicht als Ruine, sondern als Organigramm eines Reiches, das sich über Wasser, Stein und Getreide organisiert."],
      ["Wendepunkte: 1537 und danach","Im Januar 1537 siegte Manco Inca hier über Hernando Pizarro, eine der wenigen Inka-Siege gegen die Spanier: Er flutete die Ebene und ließ die Reiter im Wasser stecken. Danach zog Manco Inca nach Vilcabamba zurück, und die Kolonialverwaltung verlagerte den Schwerpunkt ins Tal bei Urubamba. Der Ort blieb bäuerlich, was ihn rettete: Der Inka-Grundriss der Altstadt überstand als Wohnraum, mit Straßen, Kanälen und Türstürzen intakt. Das ist der Stand 2026: Der Ruinen-Zutritt läuft über den Boleto Turístico, die Altstadt gehört den Familien mit Hausgarten und Bäckerei zwischen den Inka-Mauern. Die Schlacht von 1537 ist im Ort präsent, und die Topografie ist die beste Erklärung: Wer oben steht, außer Reichweite der Reiterei, kontrolliert die Ebene darunter."]
    ],
    stations:[
      ["Station 1, Eingang und Kasse","Am Fuß der Terrassenfront steht das Kassenhäuschen, spätester Einlass rund 16:00 bis 16:30. Nehmen Sie sich vor: Kassenhäuschen links, Tickets kontrollieren, Wasser mitnehmen. In der ersten Stunde nach Öffnung ist der Aufstieg deutlich leerer, weil die Busgruppen meist erst nach der Abfahrt aus Cusco ankommen. Rechts halten Sie die Straße Richtung Altstadt im Blick: Diese Seite, der Fluss, ist die historische Achse zwischen den Bahnhofs-Lagen und dem Tempel-Plateau. Es lohnt sich, beim Eingang noch einmal zurückzuschauen: Die Terrassenfront liest sich von unten am besten, bevor Sie in sie eintauchen. Nutzen Sie die Zeit, um das Wechselspiel von Stein, Wasser und Sonnenlicht zu beobachten, bevor die Treppen die Sicht begrenzen."],
      ["Station 2, Pumatallis-Treppen","Der Weg steigt über schmale Treppenfassungen senkrecht zwischen den Terrassenmauern. Achten Sie auf die Mauerbauweise: je höher Sie kommen, desto sorgfältiger geht die Bauweise von Feldstein zu Polierwerk über, und das ist kein Zufall: Die unteren Mauern sind Agrarbau, die oberen Tempelverkleidung. Zwischen den Stufen liegen kleine Kanäle, die das Regenwasser ableiten, ohne die Treppen zu untergraben. Halten Sie nach den Steinbänken Ausschau, die Reisende heute zum Rasten nutzen: Sie waren Versammlungspunkte der Arbeiter. Gegen oben öffnet der Blick in das Tal und die Wohnquartiere hinter dem Tempel. Wer ruhig geht, braucht rund 20 Minuten bis oben; die Luft ist dünner, also Tempo drosseln, und die Mauerabfolge als Leseleiter betrachten."],
      ["Station 3, Templo del Sol","Die unvollendete Wand aus riesigen Andesit-Blöcken ist das Herzstück: besonders polierte Monolithe in der Mitte, davor die zerbrochenen Blöcke des Transportwegs, der die Steinbrüche am gegenüberliegenden Bergrücken mit dem Tempel verband. Die Unvollendung ist der dokumentierte Bauabbruch: Hier stoppte die Eroberung die Arbeiten, einige Blöcke liegen bis heute samt Rutschbahn liegengeblieben. Achten Sie auf die Nischentür, die verschiedene Deutungswege der Anlage anbietet. Blick nach unten: Die Terrassen lassen sich an Zahl und Tiefe nachzählen, und die Achse zum Fluss zeigt den geplanten Endzustand. Herzstück, und trotzdem ein Ort zum Sitzen. Wer die Augen wandern lässt, entdeckt die Feinheit der Fugen zwischen den mittleren Blöcken und versteht, warum dieser Ort als technisches Meisterwerk gilt."],
      ["Station 4, Inka Watana","Ein freistehender Steinpunkt am Kamm, oft als astronomischer Marker und Blickpunkt gedeutet; der Name bedeutet übersetzt Gelenkstein, ein Bindeglied zwischen den Bauabschnitten. Wichtig und aktuell: Der Nebenweg hierhin war in den letzten Jahren mehrfach wegen Erdrutsch- und Steinschlaggefahr gesperrt, und die Kultur-Verwaltung wechselt die Zugänglichkeit unangekündigt. Wenn das Band hängt, respektieren Sie das; der Rest des Rundgangs ist unabhängig, und der Blick auf den Steinpunkt von den Stegen aus bleibt. Wer durchkommt, sieht den Rücken der Anlage: von hier sind Drainage, Terrassenkanten und die Verbindung zur Hochlandfläche als eine kompakte Fläche lesbar. Der Name ist Programm: Inka Watana gliedert die Anlage in Abschnitte und gibt dem Besucher einen Ankerpunkt für die eigene Orientierung."],
      ["Station 5, Wohnquartiere oben","Hinter dem Tempel liegen fehlerfreie Zimmerzeilen mit Nischen in sorgfältiger Bauweise, die Technik gleicht der von Machu Picchu, und das ist bewusst: Beide Anlagen lehnen sich an denselben Hofstil an. Achten Sie auf die Türstürze und Nischen in Lehmputz, die genau an der Höhe liegen, die eine liegende Person einnimmt, kein Zufall, sondern architektonische Setzung. Der Blick nach unten zeigt die Altstadt mit ihrem Schachbrettplan: durch das Kanalnetz laufen Hausbecken und Gartentüren, und die Familien leben noch heute in den Inka-Fundamenten, teilweise mit moderner Einrichtung hinter historischen Mauern. Wer hier gegangen ist, versteht, dass die Inkastadt ein Problem der Standards lösen musste: Es ging nie um Zufall, sondern um ein System, das Alltag, Wasser und Familienleben auf ein tragfähiges Fundament stellte."],
      ["Station 6, Baño de la Ñusta","Am Ende des Rundgangs liegt das Wasserheiligtum: ein Kanal führt Quellwasser über ein steinernes Becken, der Abfluss polierte den Stein glatt. Ein Werk aus der königlichen Bauphase, das bis heute funktioniert. Der Ritus gehört zum Wasser: In Zeremonien lief es von den Höhenlagen der Anlage nach unten, und das Becken mit seiner seitlichen Steinbank liest sich genau in dieser Bildsprache. Wer hier verweilt, hört den Rhythmus: erst der Fall, dann der Kanal, dann das leise Schlucken des Abflusses; genau dieser Rhythmus gab dem Ort den Namen des Bades:"],
      ["Station 7, Pinkuylluna (Template-Addon)","Auf dem steilen Nordhang liegen die Depósitos de Pinkuylluna, frei zugänglich über einen Fußpfad ab der Calle Lares gegenüber dem Picaflor Tambo Hotel; rund 90 Minuten hin und zurück, 110 bis 160 Höhenmeter, steiniger Steig, nicht bei Regen und mit heldenhaften Sohlen. Der Blick auf die Festung ist der beste Foto-Winkel des Ortes, weil Anlage, Altstadt und Fluss als Komposition zusammenkommen. Die Speicher selbst sind schmale, hochgezogene Speicher aus Feldstein, das Design hält Vorrat kühl und trocken. Wer gut zu Fuß ist, sollte das Addon definitiv machen: maximaler Lohn für einen Morgensteig ohne Ticket."]

    intro:[
      "Nur eine kurze Autofahrt ab Ollantaytambo, aber eine andere Welt: das Seitental oberhalb von Socma mit einem hoch aufragenden Wasserfall, den Inka-Ruinen von Raqaypata direkt darüber und am Rückweg dem Felsheiligtum Naupa Iglesia. Die Route ist frei zugänglich, verläuft über Gemeindeland und ist bislang kaum besucht; genau das macht sie wertvoll für Reisende, die das Valle Sagrado abseits der Busströme erleben wollen. Die Kaskade fällt über rund 100 Meter, Raqaypata liegt auf 3.646 m, der Wanderstart bei Socma auf etwa 3.100 m. Wer zuerst die Bausubstanz oben sieht, empfiehlt danach die Altstadt als lebendigen Kontrast zur ruhigen Naturroute.",
      "Der Rundgang folgt konsequent dem Wasser aufwärts: von Socma über den steilen Aufstieg zur Kaskade, dann weiter hinauf zur zeremonialen Plattform von Raqaypata, und nach Rückkehr ins Tal zum Höhlentempel bei Pachar. Rechnen Sie mit 3 bis 5 Stunden inklusive Rückweg, in der Trockenzeit (Mai bis September) auf festen Wegen, in der Regenzeit rutschig. Es gibt keine Kassen, keine Stationsbeschilderung und keine Verpflegung unterwegs; Wasser, Snacks und eine Offline-Karte gehören in den Rucksack. Wer zügig ist, ist vormittags oben, hat den Wasserfall fast allein und erreicht Pachar noch vor dem Nachmittagslicht, das die Höhle dann dramatisch ausleuchtet."

    history:[
      ["Wasserfall und Kult","Perolniyoc gilt als Wasserkult-Ort: Der Fall fällt über eine hohe Stufe in ein enges Tal, und die Menschen in Socma und im Huarocondo-Tal pflegen den Bezug bis heute. Wasser wird am steilen Talende gefasst, beim Zeremonialfest im Januar gefeiert und die Flanke wird als lebendige Kraft behandelt, nicht als Kulisse. Für die Inka war ein solcher Absturzpunkt ein idealer Ort für Zeremonien: eine Quelle, die den Berg verlässt, wird zum Symbol der Verbindung zwischen Hochland und Ackerland. Deshalb liegt genau über der Kaskade keine Speicherburg, sondern ein Zeremonialzentrum. Wer oben steht, versteht die Logik sofort: Wasser war hier Macht und Schönheit in einem, und die Route macht daraus eine landschaftliche Erzählung, die man barfuß nachwandern kann."],
      ["Raqaypata","Rund 30 Minuten oberhalb des Wasserfalls liegt Raqaypata auf 3.646 m: ein zeremonial-administrativer Komplex mit Mauern, Nischen, Kanälen und Blick in das Tal. Die Lage direkt über der Quelle legt die Funktion nahe: Hier fiel das Wasser vom Berg, hier wurde es verwaltet, verteilt und gefeiert. Die Bausubstanz ist klein, aber sorgfältig; vergleichen Sie die Mauertechnik mit Ollantaytambo, Sie werden die Verwandtschaft bei derselben Werkzeug-Dichte merken. Wer weiterwillig ist, findet hier Frieden: kaum Wind, kaum Menschen, und ein Panorama auf das Huarocondo-Tal, das einen ganzen Moment verlangt. Die Plattform lohnt sich besonders, wenn man oben kurz sitzt, einen Blick in die Kanäle wagt und dann weiterwandert, um die Umgebung als Ganzes zu erfassen."],
      ["Naupa Iglesia","Am Rückweg nahe Pachar liegt die Naupa-Iglesia-Höhle (auch Choquequilla genannt): ein fein ausgearbeitetes Felsheiligtum mit Nische und altarartiger Fassung, begriffen als Portal oder Thron. Die Widmung ist unklar: Götterportal, Grab oder Wasserkult; moderne Interpretationen pendeln zwischen Portaltheorie und Grabstätte, ohne gestützte Evidenz. Der Name Choquequilla wird meist mit Gold und Schmuck gedeutet und verweist auf die Bildsprache der Inka: Fels, Wasser und Licht an einem Punkt zusammengefaßt. Frei zugänglich, kurz, markant, und der beste Abschluss einer Route, die sonst keine Museen kennt. Der Name Choquequilla ist bis heute nicht abschließend erklärt, was den Reiz nicht mindert: Wer hier auf dem Fels sitzt, sieht Licht und Schatten im Minutenrhythmus wechseln, und die Frage nach der Bedeutung wird zum Gespräch mit dem Ort."]

    stations:[
      ["Station 1, Socma Trailhead","Das Dorf Socma (auch Soqma geschrieben) liegt hoch über dem Huarocondo-Tal; Taxi ab Ollantaytambo rund 30 bis 40 Minuten, keine regelmäßige Busverbindung. Fragen Sie vor Ort nach dem Weg und nach dem Stück Gemeindeland, das Sie durchqueren: Tore schließen, Herden kreuzen, und Respekt ist hier Bezahlung in Naturform. Lassen Sie den Plan, Hin- und Rückweg und die erwartete Zeit bei Ihrer Unterkunft hinterlegen, weil Mobilfunk im Tal spärlich ist. Vom Trailhead fällt der Blick bereits in das Seitental, in dem die Kaskade als schmaler Faden sichtbar wird, ehe der Aufstieg beginnt. Nehmen Sie sich am Start einen Moment Zeit, um die Route im Kopf und Zeitfenster im Auge zu behalten."],
      ["Station 2, Weg zum Wasserfall","Rund 2,2 Kilometer bis zur Kaskade, teils steil: Der Weg folgt zuerst Feldrändern, dann einem schmalen Pfad in den Wald. Rechnen Sie 45 bis 60 Minuten Aufwand, wobei die letzte Strecke oberhalb der Kaskade rutschig ist; greifende Schuhe und genug Wasser sind Pflicht, Handcreme hilfreich. Achten Sie auf die Bodenvegetation: Zwischen Farnen und Moosausbund liegt der Weg oft wie ein Pfad aus Vergangenheit, und Sie spüren die Nebelfeuchtigkeit, die hier anders wirkt als im Tal unten. Wer früh startet, trifft meist niemanden; wer zu Mittag geht, trifft die nasse Zeit. Nehmen Sie sich am Pfad am Anfang Zeit, um den Rhythmus des Gehens anzupassen; später wird die Steigung verlangen, was jetzt aufgebaut wird."],
      ["Station 3, Wasserfall Perolniyoc","Der Fall fällt über gerundeten Fels in ein enges Becken, die Luft ist voll mit Nebel, und die Steilheit des Aufstiegs vermittelt sich erst hier, wenn Sie den Rücken wärmen und den Blick nach oben werfen. Ein Felspodest erlaubt einen trockenen Stand; bei Regen wird das Steinschüttlauf rutschig, und die Nebelpartikel nass machen jeden Gegenstand im Rucksack. Von hier führt der einzige Weg weiter nach oben, also ist der Wasserfall zugleich Wegesmarker: Sie sind hier auf halber Strecke, und die Struktur der Route ist der Wasserlauf selbst. Pausieren Sie kurz, dann steigen Sie weiter.",""],
      ["Station 4, Raqaypata","Rund 30 weitere Minuten steigen über den Rücken zur Ruinenplattform; die Mauern sind klein, aber fein, und die Bausubstanz wirkt wie ein Ausschnitt aus einer größeren Planung. Schauen Sie in die Kanäle: Wasser steuerte das ganze Anlagensystem, von der Quelle über die Plattform bis zur Verteilung ins Tal. Von hier kreisen fast immer Falken, und das Huarocondo-Tal öffnet sich nach Norden zur Flusslandschaft; Blick nach unten zeigt die Kaskade als weiße Linie, über die Sie gerade gekommen sind. Wer die Sonne stehen lässt, sieht die Mauern im Schatten wechselnder Steine, das ist steinerne Ruhe."],
      ["Station 5, Naupa Iglesia","Der Rückweg führt zurück ins Tal: Bei Pachar, nahe der Bahnbrücke, liegt die Höhle mit der feinen Stele, im Kern ein nischenartig geometrischer Felsenaltar. Achtung: Entlang der Gleise nie auf der Schiene laufen, Züge kündigen sich mit Horn an; steigen Sie kurz über die Gleise und folgen Sie dem schmalen Pfad zum Fels. Die Höhle ist klein, der Altar leicht betretbar, und am Nachmittag fällt Licht durch den Eingang genau auf die Mitte der Nische. Riassumend: Kaskade oben, Kult unten, Wasser als verdichtetes Thema der ganzen Route. Nehmen Sie das als Abschiedsfoto mit."]
    ],
    praktisch:["Eintritt: frei; die Fläche ist Gemeinde-Land in Socma, zahlen Sie lieber Respekt als Trinkgeld: Tore schließen, Tiere kreuzen.","Zeitbedarf: 3 bis 5 Stunden inkl. Rückweg, in der Trockenzeit stabil, in der Regenzeit rutschig.","Anfahrt: Taxi ab Ollantaytambo nach Socma, Rückweg per Taxi ab Pachar; es gibt keine regelmäßige Busverbindung in das Seitental.","Ausrüstung: Wasser, Snacks, greifende Schuhe, Regenjacke auch in der Trockenzeit; Offline-Karte laden, Mobilfunk ist spärlich.","Sicherheit: nicht allein wandern, Plan bei der Unterkunft hinterlegen; die Route ist unsigniert und es gibt keine Rettungspunkte unterwegs."],

      ["Station 4, Laguna Humantay","Oben liegt der See in einem steinernen Krater, dahinter die Eisflanken des Humantay. Das Wasser wechselt je nach Licht von türkis zu jade; wer die Sonne tief stehen hat, sieht die stärkste Farbe. Halten Sie respektvollen Abstand zum Ufer, betreten Sie das Wasser nicht und fragen Sie den lokalen Guide, falls Sie mit einer kleinen Gabe gedenken wollen. Der Rückweg folgt derselben Strecke runter, was im Vergleich zum Aufstieg wie ein Geschenk wirkt. Verhalten Sie sich ruhig, damit auch andere Besucher hier denselben Moment haben.","Laguna Humantay, Cusco, desde una perspectiva poco usual.jpg"],

    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#e9e4d8"/><polygon points="60,80 180,10 300,80" fill="#f2f4f7" stroke="#8e95a3"/><text x="120" y="108" font-size="13" fill="#3b4652">Ausangate 6.384 m</text><path d="M80,330 C150,280 220,250 300,210 C380,180 450,180 540,230 C610,270 650,300 680,340" fill="none" stroke="#b59f7d" stroke-width="5"/><circle cx="150" cy="286" r="7" fill="#6f9fb8"/><text x="90" y="316" font-size="12" fill="#3b4652">Upis (Thermalquellen)</text><text x="300" y="196" font-size="12" fill="#3b4652">Palomani-Pass 5.150 m</text><circle cx="470" cy="196" r="7" fill="#6f9fb8"/><text x="430" y="226" font-size="12" fill="#3b4652">Pacchanta (Thermalquellen)</text><polygon points="560,250 640,218 700,252" fill="#e6b8b8" stroke="#b88"/><text x="560" y="278" font-size="12" fill="#3b4652">Vinicunca 5.036 m</text><g font-size="14" font-weight="bold"><circle cx="80" cy="330" r="12" fill="#3b4652"/><text x="80" y="335" fill="#fff" text-anchor="middle">1</text><circle cx="170" cy="268" r="12" fill="#3b4652"/><text x="170" y="273" fill="#fff" text-anchor="middle">2</text><circle cx="330" cy="196" r="12" fill="#3b4652"/><text x="330" y="201" fill="#fff" text-anchor="middle">3</text><circle cx="490" cy="204" r="12" fill="#3b4652"/><text x="490" y="209" fill="#fff" text-anchor="middle">4</text><circle cx="620" cy="242" r="12" fill="#3b4652"/><text x="620" y="247" fill="#fff" text-anchor="middle">5</text></g><g font-size="18" font-weight="bold" fill="#3b4652"><text x="686" y="24">N</text></g></svg>',
    planNote:"Schematisch: Der klassische Rundweg startet in Tinke, läuft über Upis und den Palomani-Pass nach Pacchanta zurück; der Vinicunca liegt am Südende der Kette und wird meist separat per Tagesausflug besucht.",
    planStations:[
      ["Tinke","Trailhead am Südende, Dörfer und Kontrollstand."],
      ["Upis","erstes Lager mit heißen Quellen unter der Südwand."],
      ["Palomani-Pass","höchster Punkt des Treks um 5.100 bis 5.200 m."],
      ["Pacchanta","Dorf mit Lagune und heißen Quellen vor dem letzten Tag."],
      ["Vinicunca (separat)","Tagesausflug ab Cusco über Cusipata."]

    history:[
      ["Heiliger Berg","Der Ausangate gilt seit vorinkanischer Zeit als heiligster Berg der Region Cusco und bestimmt bis heute den Kalender: Im Juni/zum Qoyllur Rit'i pilgern die Gemeinden in sein Eisgebiet, treffen sich in Sinakara und ziehen in Prozessionen hinauf. Für die Bauern der Quechua-Dörfer ist der Berg Herr über Wasser: Seine Gletscher speisen die Quellen, die Weiden und damit die Herden aus Lamas und Alpakas, die hier die Grundlage der Weidewirtschaft bilden. Textiles Handwerk ist in den Dörfern entsprechend tief verankert, die Muster der Vestimente zeigen Herkunft und Status."],
      ["Der Trek seligkeit","Der klassische Rundweg durchlauft fünf Tage: Tag 1 von Tinke nach Upis unterm Kamm der Südwand, Tag 2 über den ersten Pass Richtung Puca Cocha, Tag 3 der große Tag über den Palomani-Pass auf rund 5.150 m mit Blick auf die Gletscherwand, Tag 4 über die Hochlagune zu den heißen Quellen von Pacchanta, Tag 5 Abstieg zurück nach Tinke. Distanzen von 6 bis 12 Kilometer pro Tag klingen harmlos, sind über 5.000-m-Pässe aber anspruchsvoll. Mehrere Betreiber verbinden den Trek heute mit dem Vinicunca-Abstecher und nutzen die ruhige Seite des Berges."],
      ["Vinicunca und Wandel","Der Farbberg verdankt seine Streifen mineralischen Ablagerungen aus rotem Eisenoxid, gelbem Schwefelmineral, grünem Kupferhaltigem Grau und weißem Kalksalz; sie traten sichtbar hervor, als sich in den letzten Jahrzehnten der Permafrost des Berges zurückzog. Seit rund 2016 ist Vinicunca ein Massenziel: Cusipata ist Ausgangspunkt, der Aufstieg misst rund drei Kilometer, und die Gemeinden verlangen Eintritt, zuletzt S/ 30 für ausländische Gäste (Stand Juni 2026, MINCETUR). Palccoyo auf rund 4.900 m bildet die leichte Alternative mit flacherem Aufstieg und erheblich weniger Andrang."]
    ],
    stations:[
      ["Station 1, Tinke und Anmarsch","Tinke ist ein Weiler am Südende der Vilcanota-Kette, Startpunkt des klassischen Rundwegs; hier füllen Trekking-Veranstalter das letzte Wasser auf, der Check läuft über Community-Chefs, und die ersten Kilometer laufen flach über Weiden. Herden aus Lamas, Alpacas und Schafen begleiten Sie bereits am Nachmittag über die Pampa; Kinder winken von den Mauern der Steinencasitas aus. Der Weg ist breit und gut zu sehen, die Hauptschwierigkeit beginnt erst ab dem zweiten Tag; hier zählt vor allem, den Körper an die Höhe zu gewöhnen."],
      ["Station 2, Upis","Upis liegt unter der Südwand des Ausangate und ist das erste Lager des klassischen Rundwegs, mit einfachen Steinherbergen und heißen Quellen, in denen man abends baden kann. Wenn die Wolken offen sind, lohnt der Blick auf die vergletscherte Flanke, die den ganzen Lagerplatz überwacht. Der Platz ist windig; nehmen Sie eine warme Schlafjacke und warme Schlafsachen für eine Nacht über 4.400 m mit. Am Abend werden Snackbarstände abgebaut, und die Familie der Herberge zählt die Gäste für die Nacht."],
      ["Station 3, Palomani-Pass","Der Pass auf rund 5.150 m ist der Höhe- und Wendepunkt des Treks: Von hier überblicken Sie die gesamte vergletscherte Südwand und blicken in das Seitental hinunter, durch das die Route weiterläuft. Steigen Sie langsam, machen Sie Stops nach jedem Satz, und nutzen Sie die Steinhaufen als Taktgeber. An klaren Tagen sehen Sie nach Norden die längere Kette mit den Vilcanota-Gipfeln; an trüben Tagen liegt hier Nebel. Der Abstieg ist steinig, Knieleisten schützen Knie, und am Ende wartet die Rast am Bach vor dem Aufstieg zum vorletzten Lager."],
      ["Station 4, Pacchanta","Pacchanta ist ein Dorf am Fuß des Ausangate mit Lagune, Weiden und mehreren Becken mit heißen Quellen, die Wanderer abends nutzen, wenn die Herden ins Dorf treiben. Die Lage ist groß: Der Berg steht wie eine Wand über dem Weichbild, das Wasser dampft, und die Temperatur kontrollieren die Familien vor Ort. Hier kostet die Nutzung einen kleinen Unkostenbeitrag, den die Gemeinde direkt kassiert. Wer Tage übrig hat, verlängert hier eine Nacht und richtet Blick und Herz auf die Landschaft aus, die ihn sieben Tage lang begleitet hat."],
      ["Station 5, Vinicunca (Tagesausflug)","Ab Cusco startet die Tour zwischen 3 und 4 Uhr morgens, Fahrt über Cusipata, dann rund drei Kilometer Anstieg zum Sattel auf 5.036 m. Die Streifen treten ab dem ersten Aufstieg deutlich sichtbar hervor, rot, gelb, grün und weiß in Bändern; am Horizont liegt der Ausangate als klare Silhouette. Der Andrang ist hoch, die Bänder an der Kante eng; am besten kommt man früh oder man wählt Palccoyo für Ruhe. Beim Abstieg kurz dem Boden halten, der Schritt ist steinig."],
      ["Station 6, Rückblick und Bilanz","Wer beide Seiten der Kette gesehen hat, erkennt den Unterschied: Am Ausangate-Trek bestimmt die Landschaft das Tempo, am Vinicunca bestimmt die Menschenmasse. Die Höhe ist in beiden Fällen der eigentliche Gegner, Soroche (Höhenkrankheit) erreicht hier fast jeden einmal. Nehmen Sie sich vor, bei Kopfschmerzen, Übelkeit oder Orientierungslosigkeit abzubrechen; der Berg bleibt. Für Fotografie gilt: am besten am Morgen mit tiefem Licht, für Panoramaaufnahmen von der Krajina am Palomani-Pass, für Menschenbilder in Pacchanta."]
    ],
    praktisch:["Eintritt Vinicunca: S/ 30 für ausländische Gäste, S/ 15 für Peruaner, kassiert von Gemeinden (Stand Juni 2026, MINCETUR); nicht im Boleto Turístico.","Trek: geführte 5-Tage-Touren ab Cusco mit Maultieren, Zelten und Koch meist 400 bis 650 US$ je Person; eigenständig schwierig wegen Höhen und Nachtlagern.","Bester Zeitraum: Trockenzeit Mai bis September, Nächte bis minus 10 Grad, Tageslicht satt; Regenzeit Januar bis März deutlich riskanter wegen Rutsch.","Höhenordnung: Tinke 3.900 m, Upis über 4.400 m, Palomani-Pass 5.100 bis 5.200 m, Pacchanta 4.300 m, Vinicunca 5.036 m.","Soroche: zwei bis drei Tage Cusco vorab, Coca-Tee, viel trinken, langsam gehen, bei starken Symptomen absteigen statt durchhalten."],
    sources:["peru-spirit.com: Ausangate-Trek-Guide 2026","salastravelperu.com: Vinicunca vs Palccoyo vs Pallay Punchu (Nov 2026)","andina.pe: Vinicunca-Gebühren und Gemeinden"]

  {
    id:"mandor",

    meta:["Rund 4 km Schienenweg ab Aguas Calientes","Einritt ca. S/ 20 bar","3,5 bis 4,5 Std gesamt","Nebelwald mit Orchideen"],
    intro:[
      "Die Jardines de Mandor sind ein privat betriebenes Gartengelände mit Wasserfall rund vier Kilometer von Aguas Calientes entfernt, in Richtung Hidroeléctrica. Der Weg folgt der aktiven Bahnstrecke durch Nebelwald, dann zweigt ein Forstpfad zum Fall ab. Es ist der Ausflug, den die meisten Machu-Picchu-Besucher nie machen: kein Ticketdruck, kein Zeitfenster, dafür Vogelstimmen, Farne, Orchideen und ein Fall, der in ein enges Becken stürzt. Der Eintritt kostet rund S/ 20 in bar an der Schranke vor Ort.",
      "Planen Sie drei bis fünf Stunden inklusive Rückweg ein, davon rund 1 bis 1,5 Stunden entlang der Schienen und je rund 20 bis 30 Minuten auf dem Gartenpfad. Wichtige Vorbedingung: trockenes Wetter. Nach Muren rutschen Gestein auf die Strecke; nach den Regenfällen im Januar und März 2026 war die Route mehrfach unterbrochen. Nehmen Sie Wasser, Snacks und Bargeld mit, fragen Sie in der Unterkunft nach dem aktuellen Stand."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#e4ecd8"/><polygon points="0,140 720,60 720,40 0,120" fill="#a3b58e"/><path d="M60,330 C200,300 420,270 660,250" fill="none" stroke="#8f8f8f" stroke-width="4"/><g stroke="#5f5f5f" stroke-width="2"><line x1="140" y1="312" x2="140" y2="324"/><line x1="240" y1="300" x2="240" y2="312"/><line x1="340" y1="290" x2="340" y2="302"/><line x1="440" y1="281" x2="440" y2="293"/><line x1="540" y1="272" x2="540" y2="284"/></g><text x="70" y="368" font-size="12" fill="#3b4652">Aguas Calientes</text><rect x="600" y="228" width="70" height="18" rx="4" fill="#6f5c4b"/><text x="594" y="262" font-size="12" fill="#3b4652">Tor Mandor</text><path d="M620,230 L630,150" stroke="#b59f7d" stroke-width="4" fill="none"/><line x1="630" y1="40" x2="630" y2="150" stroke="#6f9fb8" stroke-width="5"/><text x="560" y="32" font-size="12" fill="#3b4652">Catarata de Mandor</text><g font-size="14" font-weight="bold"><circle cx="80" cy="326" r="12" fill="#3b4652"/><text x="80" y="331" fill="#fff" text-anchor="middle">1</text><circle cx="300" cy="288" r="12" fill="#3b4652"/><text x="300" y="293" fill="#fff" text-anchor="middle">2</text><circle cx="620" cy="228" r="12" fill="#3b4652"/><text x="620" y="233" fill="#fff" text-anchor="middle">3</text><circle cx="630" cy="120" r="12" fill="#3b4652"/><text x="630" y="125" fill="#fff" text-anchor="middle">4</text><circle cx="380" cy="360" r="12" fill="#3b4652"/><text x="380" y="365" fill="#fff" text-anchor="middle">5</text></g><g font-size="18" font-weight="bold" fill="#3b4652"><text x="686" y="24">N</text></g></svg>',
    planNote:"Schematisch: der Weg folgt der Bahnstrecke flussaufwärts Richtung Hidroeléctrica; am Tor von Mandor zweigt der Gartenpfad zum Wasserfall ab; der Rückweg läuft auf derselben Strecke.",
    planStations:[
      ["Aguas Calientes","Start am Ende der Stadtbrücke Richtung Schienen."],
      ["Schienenweg","rund 3 km durch Nebelwald, nie auf den Gleisen laufen."],
      ["Tor Mandor","Schranke und Kasse, Gebühr bar."],
      ["Wasserfall","Forstpfad 20 bis 30 Minuten zum Fall."],
      ["Rückweg","dieselbe Strecke zurück, Zeit auf Reserven einplanen."]
    ],
    history:[
      ["Nebelwald und Privatschutz","Das Tal unter dem Machu-Picchu-Heiligtum fällt in den Nebelwald, das feuchteste Stück der ganzen Region: Böden brauchen miejsca schwer, Farnensequenzen, Moospolster stehen dicht, und Orchideen hängen über den Weg. Die Familie, die Mandor besitzt, hat das Gelände über Jahrzehnte als Privatgarten gepflegt und damit eine Wildnis erreicht, die zugleich begehbar bleibt. Kaffeebüsche und Obstbäume wachsen zwischen einheimischen Bäumen, Tukane und Kolibris halten sich nahe der Blüten; der Zugang funktioniert über eine kleine Gebühr, die Wege und Pflanzung unterhält."],
      ["Wasserfall und Sicht","Die Catarata de Mandor fällt über eine hohe Stufe in ein Becken, umgeben von Farnen und Felsen; das Wasser ist kalt und die Strömung stark. Schwimmen ist nicht ratsam, der Grund ist unregelmäßig und die Strömung wechselt mit dem Wetter. Die Aussicht auf den Fall ist umso prächtiger, je weniger Sie im Gepäck haben: Nebel und Gischt machen Linsen nass, also Regenjacke und Tuch einplanen. Der Garten unterhalb des Falls bietet Bankplätze und einen kleinen Teich; wer still sitzt, wird schnell Belohnungen in Form von Vögeln finden."],
      ["Wandel und Risiko","Die Region trägt die Spuren ihrer Steilheit: Starkregen verursacht regelmäßig Muren und abgerutschte Bäume auf der Bahnstrecke, zuletzt im Januar und März 2026, als das Tal mehrere Tage von der Außenwelt abgetrennt war. Für Mandor bedeutet das: Der Weg ist besser bei trockenem Wetter, die Rückreise sollte großzügig gepuffert sein, und man sollte nicht allein gehen. Die Familie des Geländes kontrolliert den Zugang und schließt bei Gefahr das Tor. Wer die Unsicherheit akzeptiert, bekommt einen der letzten stillen Ausflüge in Aguas Calientes."]
    ],
    stations:[
      ["Station 1, Start in Aguas Calientes","Vom Ende der Stadtbrücke führt ein kurzer Weg zur Bahnlinie Richtung Hidroeléctrica; Einzelhändler, Unterkünfte und Restaurants bleiben rasch hinter Ihnen, der Wald übernimmt. Orientieren Sie sich an der Bahn: Sie läuft stromaufwärts, der Weg ist flach, und die Umgebung wird luftig und grün. Nehmen Sie Zeit, fragen Sie in der Unterkunft nach der Wetterlage und dem Zugplan, und gehen Sie am besten vormittags, um Rückreserven zu haben. Ein Blick zurück zeigt die Felsenwand, über der die Ruinen von Machu Picchu im Nebel liegen.","Aguas_Calientes.jpg"],
      ["Station 2, Schienenweg durch den Nebelwald","Rund drei Kilometer laufen Sie neben den aktiven Gleisen: Einzug der üppigen Vegetation, Farne mit Fingern, Moosteppiche, Strom durch die Luft. Die Regel ist strikt: Nie auf den Gleisen laufen, immer zwei bis drei Meter seitlich im begrünten Rand bleiben, denn Züge kommen leise und kündigen sich spät an. An klaren Stellen fällt der Blick auf den Vilcanota, der hier als schmaler Canyon plätschert; an feuchten Tagen hängt Nebel in den Bäumen. Orchideen blühen das ganze Jahr, viele in Terrakotta entlang des Wegs.","Mandor_trail.jpg"],
      ["Station 3, Tor Mandor","Eine kleine Schranke, ein Hinweisbrett, ein Tisch: Hier zahlt man die Gebühr, rund S/ 20 in bar, und kann nach dem Weg fragen. Das Personal erklärt kurz die Pflege des Gartens, die Ist-Lage nach keyenen Starkregen und die Regeln: nichts pflücken, die Bankplätze nutzen, auf dem Pfad bleiben. Ab hier beginnt der echte Waldweg, ein Forstpfad, der einige Minuten leicht auf- und abwärts läuft. Nehmen Sie sich vor dem Einstieg Zeit und schauen Sie auf die Uhr, um die Rückfahrt glatt zu planen.","Mandor_gate.jpg"],
      ["Station 4, Catarata de Mandor","Der Pfad öffnet sich am Wasserfall: Der Fall stürzt über eine hohe Stufe in ein Becken, um ihn herum wachsen Farne, und die Luft ist gesättigt mit Nebel. Ein kleiner Aussichtspunkt erlaubt einen trockenen Stand; stellen Sie sich nicht in den Gischtbereich, wenn Ihre Ausrüstung nass werden soll. Wer still sitzt, sieht nach kurzer Zeit Kolibris und Tukane, die im Nebelwald um die Blüten kreisen. Das Becken ist nicht zum Schwimmen gedacht, Strömung und Untergrund sind unregelmäßig; lassen Sie Kinder besonders an der Wasserlinie beobachten.","Mandor_waterfall.jpg"],
      ["Station 5, Rückweg","Der Rückweg folgt derselben Strecke zurück zur Stadt; Planen Sie mindestens den halben Aufwand ein, der Abstieg ist steinig, und die Schienen verlangen weiterhin Konzentration. Am besten gehen Sie, je nach Tag, vor dem Nachmittagslicht, das im Nebelwald schnell schwindet. In Aguas Calientes angekommen, lohnt eine warme Dusche oder ein Tee, bevor die Reise weitergeht: Busterminal, Bahnhof, Museumsbesuch oder Markt bleiben genug Auswahl. Schauen Sie noch einmal zurück auf die grüne Wand über der Stadt; genau diese verdichtet die Magie des Gebietes am meisten."]
    ],
    praktisch:["Gebühr: rund S/ 20 pro Person in bar am Tor (Stand Nov 2026, ältere Guides sagen S/ 10); keine Online-Buchung nötig.","Zeitbedarf: 3,5 bis 4,5 Stunden gesamt, davon 1 bis 1,5 Stunden je Richtung auf den Gleisen; am besten vormittags bei trockenem Wetter.","Sicherheit: nie auf den Gleisen laufen, Züge kommen leise; nach Starkregen oder Muren den Fußweg nicht antreten, in der Unterkunft nach dem Stand fragen.","Ausrüstung: feste Schuhe mit Profil, Regenjacke, Wasser und Snacks; Bargeld für die Kasse, keine Karten.","Rückweg: In Aguas Calientes gibt es Bäder, Cafés und das Manuel Chávez Ballón Museum als ergänzende Halbtagsprogramme."],
    sources:["yapaexplorers.com: Mandor Waterfall Guide (Nov 2026)","attractionsnear.me: Mandor Gardens Entry Fee 2026","machupicchuhelp.com: Aguas Calientes Beyond the Ruins (Nov 2026)"]

    intro:[
      "Am südlichen Rand von Aguas Calientes, am Weg zur Puente Ruinas, liegt das Manuel Chávez Ballón Museum, das zentrale Archäologiemuseum des Machu-Picchu-Heiligtums. Fünf Räume erzählen die Geschichte der Stätte: Keramik, Stein- und Metallobjekte, Modelle, Karten und Videos, von den ersten Grabungen bis zur Welterklärung. Zum Gelände gehört ein botanischer Garten mit lokalen Pflanzen, Farnen und vor allem Orchideen, die der Region zahllos gehören; der Fußweg dorthin läuft gemütlich am Fluss entlang.",
      "2026 wird der Besuch besonders attraktiv: Nach neuen Regeln ist das Museum von 12 bis 16 Uhr frei zugänglich, regulär kostet es S/ 22 für Erwachsene. Wer morgens nach Machu Picchu im Zeitfenster ist, verbringt den Nachmittag hier; wer am Vortag ankam, geht vor dem Mittagessen. Halten Sie Bargeld oder eine Karte bereit, und nehmen Sie sich für das Museum rund eine Stunde, für den Garten laufen 20 bis 30 Minuten."

    history:[
      ["Museum und Aufarbeitung","Benannt ist das Museum nach dem Archäologen Manuel Chávez Ballón, der von den 1960er bis 1970er Jahren die Erforschung des Machu-Picchu-Heiligtums vorantrieb. Eröffnet wurde die heutige Einrichtung 2005 nach einem Neukonzept: Statt Reliquienschau erzählt das Museum acht Sequenzen, wie die Stätte gebaut wurde, wie sie funktionstüchtig war, wie sie gefunden und erforscht wurde und wie sie heute geschützt wird. Für Reisende, die vor oder nach dem Anstieg nach Machu Picchu im Dorf sind, ist es die beste Ergänzung zu den Ruinen selbst, weil hier die Fundstücke und Modelle stehen, die dort nur als wiederaufgebaute Wände sichtbar sind."],
      ["Botanischer Garten","Der Garten am Museum zeigt die botanische Seite des Heiligtums: Farne, einheimische Sträucher, Blüten, und vor allem die Orchideen, für die die Region Machu Picchu im internationalen Vergleich bemerkenswert ist. In Beeten wachsen hier Hunderte von Sorten, teils in Beeten, teils sorgfältig gesetzt. Die Beschilderung ist einfach, die Farben intensiv; wer Zeit hat, sitzt hier nach dem Museum am Ufer und beobachtet Kolibris zwischen den Blüten. Der Garten ist eine der wenigen Orte in Aguas Calientes, an denen die Natur der Region zur Farbe ihrer Zerstörung wird, und gleichzeitig zu ihren Chancen."],
      ["Wandel und Zugang","Die Regelung von 2026 hat den Zugang demokratisiert: Seit der Verordnung RM 334-2026-MC vom 11. September 2026 ist der Besuch des Museums von 12 bis 16 Uhr frei, regulär S/ 22 für Erwachsene, S/ 11 für Studenten, frei für Kinder, Peruaner über Alter und Menschen mit Behinderung. Die Verbindung von Museum und Garten macht aus einem halben Tag im Dorf ein rundes Programm; wer Mandor oder die Botanik am selben Tag plant, sollte auf die Wetterlage achten und die Reihenfolge flexibel halten."]

    stations:[
      ["Station 1, Weg Richtung Puente Ruinas","Vom Zentrum von Aguas Calientes laufen Sie rund 30 Minuten entlang des Flusses in Richtung der Brücke, die zur Ruinenstraße führt; der Weg ist asphaltiert, flach und unter Bäumen. Unterwegs passen Sie auf Verkehr auf, denn die Straße wird von Bussen der Ruinen-Zufahrt genutzt; bleiben Sie auf dem Gehweg. Der Fluss rauscht nebenher, oben hängt der Nebel in der Felswand. Wer den Umweg liebt, macht hier auch echte Vogelbeobachtungen, weil die Ufer deutlich ruhiger sind als die Stadt.","Puente_Ruinas.jpg"],
      ["Station 2, Museo Manuel Chávez Ballón","Das Museum ist kompakt, aber klug gebaut: Keramik, Steinmetzobjekte, Metallarbeiten und Dokumente illustrieren, wie das Heiligtum entstand, wie es gedient hat und wie es entdeckt wurde. Modelle zeigen Anordnung und Wasserbau der Ruinen, Videos kaufen Kontext, und die Beschriftung ist zweisprachig. Nehmen Sie sich rund eine Stunde und nutzen Sie die frei Nachmittag, wenn Ihr Reisetermin passt. Fotografieren ist in den meisten Räumen ohne Blitz erlaubt; fragen Sie an der Kasse. Ein Rundgang hier verändert den Blick auf den Anstieg am nächsten Morgen.","Museo_Chavez_Ballon.jpg"],
      ["Station 3, Botanischer Garten","Hinter dem Museum öffnet sich der Garten: Beete, Pfade und Dachgestelle, in denen Orchideen und einheimische Pflanzen gedeihen. Die Beschilderung ist einfach, die Farben springen ins Auge; wer einen Fotografie-Auge hat, hat hier viel Freude. Kolibris kommen oft zum nett sitzender Pausen; machen Sie sich leise. Der Rundgang dauert rund 20 bis 30 Minuten, bei großen Interesse auch länger. Der Garten ist eine der wenigen Orten in Aguas Calientes, an denen die botanische Vielfalt der Region direkt erlebbar bleibt.","Orkidee.jpg"],
      ["Station 4, Rückweg am Fluss","Auf dem Rückweg zur Stadt lohnt ein kurzer Blick auf das Flussufer und die Felswand über Ihnen; die Straße bleibt belebt, aber relativ ruhig nach den Bustouren. Wer Hunger hat, führt der Weg am Abend in die Stadt; wer Zeit übrig hat, Weiter zur Bahnbrücke und zurück über die kleine Fußgängerbrücke. Halten Sie Bargeld oder eine Karte bereit, falls Sie während der Ausstellung ein kleines Andenken erwerben wollen, und beachten Sie: In der Regenzeit macht eine Regenjacke wirklich Sinn."]
    ],
    praktisch:["Gebühr: S/ 22 für Erwachsene, S/ 11 für Studenten; frei von 12 bis 16 Uhr nach RM 334-2026-MC (11 Sep 2026); Kinder, Peruaner im Alter und Menschen mit Behinderung frei.","Öffnungszeiten: Montag bis Sonntag 9 bis 16 Uhr, freie Afternoon-Fenster nachmittags.","Anfahrt: rund 30 Gehminuten von Aguas Calientes über die Puente Ruinas-Straße, flache Strecke, Busse beachten.","Besuchsdauer: Museum rund 1 Stunde, Garten 20 bis 30 Minuten; Kombination mit Mandor an einem Tag möglich, dann morgens Mandor.","Fotografie: meist ohne Blitz erlaubt, an der Kasse nachfragen; im Garten freistellen, Kolibris nicht füttern."],
    sources:["machupicchuhelp.com: Aguas Calientes Beyond the Ruins (Nov 2026)","gob.pe: Museo de Sitio Manuel Chávez Ballón","machupicchu.org: Museo Manuel Chávez Ballón"]

    intro:[
      "Sillustani liegt auf einer Halbinsel über dem Umayo-See, rund 34 Kilometer und eine knappe Stunde von Puno entfernt. Zwölf Grabtürme, die Chullpas, stehen auf dem Höhenzug: runde Steintürme der Kolla-Kultur aus dem 13. bis 15. Jahrhundert, die die Inka später in eigener Bauweise fortsetzten. Die Lage ist bewusst gewählt: Wasser am unteren Horizont, weite Sicht, Wind. Wer hereingeht, versteht schnell, dass Friedhof und Landschaft hier eine Einheit bilden.",
      "Dieses Kapitel führt Sie den Standardrundweg entlang: vom Eingang über die Mirador-Kante zu den größten Türmen, darunter die Lagarto-Chullpa, der höchste Turm der Anlage. Wir lesen die Türme als Text in Stein: Steinmetzkraft zeigt Hierarchie, die nach Osten gerichtete Türöffnung zeigt Sonnenbezug, die Eidechsenreliefs zeigen Wiedergeburt. Zwei Stunden reichen; Nachmittagstouren ab Puno passen sich an Busankünfte an, am frühen Nachmittag ist es am leersten."

      ["Eingang und Kasse","unten am Zugangsweg, hier Eintritt, Toiletten und kleiner Laden."],
      ["Mirador über dem See","erste Kante mit Blick auf Umayo und die Turmgruppe."],

    history:[
      ["Bauzeit und Vorgeschichte","Sillustani gehört der Kolla-Kultur, einem Nachfolger von Tiwanaku, und datiert ins 13. bis 15. Jahrhundert, bevor die Inka die Region Puno einnahmen. Kolla-Türme sind rund und aus grob zugerichtetem Stein; die Inka-Türme am selben Hügel sind rechteckig und aus exakt gefügten Quadern ohne Mörtel. Begraben wurden Angehörige der Oberschicht in Hockstellung, mit Kleidung und Schmuck als Beigaben; eine einzige Türöffnung zeigt nach Osten zur aufgehenden Sonne. Mit zwölf Metern Höhe steht in Sillustani die höchste Chullpa des Altiplano."],
      ["Symbolik und Funktion","Die Chullpa war kein Grab im christlichen Sinn, sondern ein Haus der Ahnen, das die Familie über Generationen hegte. Die nach Osten gerichtete Öffnung verband die Toten mit dem Umlauf der Sonne, und die oft eingeritzten Eidechsen meinten das wiederkehrende Leben, weil sich der Schwanz des Tiers erneuert. Hoch oben auf der Halbinsel waren Tote und See verbunden: Das Wasser galt als Urgrund, die Kuppe als Übergangsraum zwischen Erde und Ahnenwelt. Wer die Türme liest, liest eine Besteigungsvorschrift für die Totenreise."],
      ["Wandel und Gegenwart","Grabräuber, Erdbeben und Wetter haben viele Türme geöffnet und gekappt, einige blieben unvollendet. Seit dem 19. Jahrhundert sind sie dokumentiert, Ephraim Squier zeichnete bereits 1877 Pläne. Heute liegt Sillustani auf dem Standardprogramm Punos, meist als Nachmittagstour vor dem Nachtbus nach Arequipa oder dem Flug ab Juliaca. Toilettendienst und Eintritt sind einfach gehalten, Kassenhäuschen und Informationstafel genügen; die Wirkung tragen Wasser und Türme, nicht Infrastruktur. Wer an einem freien Nachmittag in Puno Zeit hat, sollte sie hier verwenden."]
    ],
    stations:[
      ["Station 1, Eingang und Aufstieg","Am unteren Parkplatz lösen Sie den Eintritt, rund S/ 15 in bar, und beginnen den Weg auf die Halbinsel. Beachten Sie den sanften Aufstieg von wenigen Minuten, aber mit voller Altiplano-Windlast; gehen Sie langsam, Sie sind knapp 3.900 Meter hoch. Links und rechts liegen Felder und einfache Häuser, die Steppe ist braun und kurzgrasig. Der Weg endet an einer Kante, und dort liegt der See mit den Tierstimmen. Notieren Sie als Merkregel: Sillustani ist höher als Puno, Kurzatmigkeit ist Signal zum Verlangsamen, Wasser gehört in die Jackentasche.","Sillustani.jpg"],
      ["Station 2, Mirador über dem Umayo-See","Von der ersten Kante überblicken Sie Wasser, Halbinsel und Steppe. Lesen Sie die Lage als Plan: Ein Grabbezirk braucht Sichtbarkeit, und genau dafür stehen die Chullpas auf der Kuppe, gut sichtbar von Weitem. Über dem Ufer weiden Lama- und Alpakaherden, die mehr über die Wirtschaftsweise der Halbinsel erzählen als über den Ritus. Der Wind ist hier das stärkste Sinneselement: Windjacke und Kappe sind sinnvoll, Handschuhe am Morgen hilfreich. Wer fotografieren möchte, bekommt am Nachmittag tiefes Licht über dem See, am Vormittag harte Sonne und klare Ferne.","Laguna_Umayo.jpg"],
      ["Station 3, Lagarto-Chullpa","Der größte Turm der Anlage trägt seinen Namen nach den eingeritzten Eidechsen, deren nachwachsender Schwanz das wiederkehrende Leben meinte. Betrachten Sie das Mauerwerk von beiden Seiten: unten Feldstein, oben feinere Quader, oben sauberer gearbeitet als unten. Schauen Sie auf die Türöffnung nach Osten: Tote wurden in Hockstellung beigesetzt, Grabbeigaben wie Kleidung und Schmuck begleiteten sie. Die Lage auf der Kuppe, der Osten-Bezug und die Reliefs ergeben zusammen ein Programm, das man von einem Friedhof nicht erwartet. Nehmen Sie sich hier Zeit, die Wirkung entfaltet sich erst bei genauem Hinsehen.","Chullpa_Lagarto_Sillustani.jpg"],
      ["Station 4, Inka-Türme und Rückweg","Am Ende der Kuppe stehen die rechteckigeren Turmbauten der Inka, die das Formenrepertoire der Kolla in eigener Bauweise nutzten. Vergleichen Sie: Kolla-Türme wirken rund und massig, Inka-Stein ist exakt gefügt ohne Mörtel und trägt sein Gewicht als Gefüge. Der Rückweg führt wieder abwärts, mit frischem Wind und Blick zurück auf die Kuppe. Für die Weiterfahrt gilt eine Merkregel: Wer ab Juliaca fliegt, rechnet rund 45 Minuten Anfahrt zusätzlich ein; wer mit dem Nachtbus weiterzieht, koppelt Sillustani gut an einen freien Nachmittag in Puno.","Sillustani_Chullpas.jpg"]

    praktisch:["Eintritt: rund S/ 15 pro Erwachsener, bar, Stand Nov 2026; Öffnungszeiten nach aktuellen Reiseführern 8.30 bis 17.30 Uhr, an einigen Tagen eingeschränkt.","Anfahrt: rund 45 Minuten von Puno; Nachmittagstouren ab Puno kosten etwa US$ 15 bis 45, meist mit Hotelabholung, Kombination mit dem Flug ab Juliaca vor dem Abflug gut machbar.","Höhe: rund 3.890 m, höher als Puno; langsam gehen, Wasser mitnehmen.","Zeitbedarf: 1 bis 1,5 Stunden; nachmittags wird es windig und kalt.","Bargeld: kleine Scheine, am Eingang gibt es kein Kartenterminal."],

    intro:[
      "Der Titicacasee liegt auf 3.812 Metern und gilt als höchster schiffbarer See der Welt. Auf der peruanischen Seite bauen die Uro-Gemeinschaften ihre Inseln komplett aus Totora-Schilf: handgelegte Etagen auf Wurzelpolstern, die ständig ergänzt werden müssen, weil das Schilf von unten verrottet. Der Tagesausflug verbindet zwei Welten: am Vormittag die schwimmenden Uros-Inseln nahe Puno, am Nachmittag die feste Insel Taquile mit ihren Terrassen und der alten Quechua-Textiltradition.",
      "Dieses Kapitel erklärt den Tageslauf und, was Sie auf beiden Inseln wirklich beobachten sollten: Auf den Uros, wie eine Familie ihren Untergrund erklärt und erneuert; auf Taquile die Textilcodes, bei denen Männer stricken und die Mützen Auskunft über Stand und Zugehörigkeit gaben. Dazu kommt die Kostenseite: Inselabgaben, Bootsfahrpreis, Mittag bei einer Familie. Ganztagestouren ab Puno starten um 7 Uhr und kehren gegen 17 Uhr zurück; Halbtagestouren beschränken sich auf die Uros."
    ],
    planSvg:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><rect width="720" height="400" fill="#3f6784"/><ellipse cx="360" cy="210" rx="330" ry="180" fill="#5f8caa"/><ellipse cx="120" cy="120" rx="55" ry="22" fill="#c9b458"/><text x="120" y="124" font-size="11" fill="#3b3040" text-anchor="middle">Uros</text><ellipse cx="250" cy="180" rx="40" ry="16" fill="#c9b458"/><ellipse cx="560" cy="230" rx="70" ry="40" fill="#8a9a5b"/><text x="560" y="234" font-size="11" fill="#2f3a20" text-anchor="middle">Taquile</text><ellipse cx="660" cy="120" rx="45" ry="20" fill="#8a9a5b"/><text x="660" y="124" font-size="11" fill="#2f3a20" text-anchor="middle">Amantani</text><rect x="30" y="330" width="90" height="18" rx="6" fill="#3b4652"/><text x="75" y="343" font-size="11" fill="#fff" text-anchor="middle">Puno</text><path d="M80,330 L150,140 L230,185" fill="none" stroke="#d8e3ea" stroke-width="4" stroke-dasharray="8 6"/><path d="M300,180 L500,225" fill="none" stroke="#d8e3ea" stroke-width="4" stroke-dasharray="8 6"/><g font-size="14" font-weight="bold"><circle cx="80" cy="330" r="12" fill="#3b4652"/><text x="80" y="335" fill="#fff" text-anchor="middle">1</text><circle cx="150" cy="140" r="12" fill="#3b4652"/><text x="150" y="145" fill="#fff" text-anchor="middle">2</text><circle cx="380" cy="200" r="12" fill="#3b4652"/><text x="380" y="205" fill="#fff" text-anchor="middle">3</text><circle cx="560" cy="195" r="12" fill="#3b4652"/><text x="560" y="200" fill="#fff" text-anchor="middle">4</text></g><g font-size="18" font-weight="bold" fill="#fff"><text x="686" y="24">N</text><polygon points="690,28 684,42 696,42"/></g></svg>',
    planNote:"Schematisch, nicht maßstäblich: Route ab Hafen Puno über mehrere Uros-Inseln zur Insel Taquile und zurück; Amantani liegt weiter südwestlich und wird nur bei Übernachtungstouren angefahren.",
    planStations:[
      ["Hafen Puno","morgens ab 7 Uhr, Abfahrt an der Uferpromenade."],
      ["Uros-Inseln","kurze Fahrt, Vorstellung eines Familienverbands, Schilfboden."],
      ["Überfahrt nach Taquile","gut zwei Stunden über offenes Wasser."],
      ["Taquile","Aufstieg zum Hauptplatz, Textilvorführung, Mittag bei einer Familie."]
    ],
    history:[
      ["Bauzeit und Vorgeschichte","Die Uros werden als frühe Bewohner des Sees gelesen, die sich auf Schilfinseln zurückzogen, lange vor Inka und späteren Aymara-Gruppen; genaue Herkunft und Alter sind umstritten. Jede Insel entsteht aus einer Wurzelmatte, die mit Pfählen verankert und in Schichten mit Totora-Schilf belegt wird. Die unterste Schicht verrottet und muss laufend von oben ergänzt werden: Unterhalt ist hier Zustand, nicht Ausnahme. Auf Taquile lebte die Quechua-Gemeinschaft lange sehr isoliert, bis Tourismus in den 1970er-Jahren eine kontrollierte genossenschaftliche Verwaltung brachte."],
      ["Symbolik und Funktion","Beide Inseln zeigen eng organisierte Selbstversorgung. Das Schilf liefert Insel, Boote, Häuser, Brennstoff und Nahrungszusatz; was genutzt wird, wird ersetzt. Auf Taquile liest die Siedlung zurück: Terrassen für Kartoffeln, Weideflecken oben, Pfadaufstieg zum Hauptplatz als Zentrum. Textil ist hier Gesellschaftssystem: Die Mützen der Männer, die Schärpen der Frauen und die Farben folgen Codierungen der Region; die Textiltradition der Taquileños wurde 2005 in die Liste des immateriellen Kulturerbes der UNESCO aufgenommen."],
      ["Wandel und Gegenwart","Beide Inseln sind heute als Gastgeber organisiert: Boote pro Verband, Teilnehmer von Familien versorgt aus Küche und Webstuhl. Ökonomie und Alltag stehen in Spannung: Peak-Season Juni bis August ist oft Tage im Voraus ausgebucht, und der Aufenthalt auf den Uros bleibt kurz und bühnenartig. Der See reguliert mit: Bei Niedrigwasser verkürzen sich Routen, bei Sturm entfallen Fahrten. Getragen wird der Zugang von Besucherzählung und kleinen Abgaben; wer genug Zeit hat, wählt die 3-Tages-Variante mit Übernachtung bei einer Familie auf Amantani."]
    ],
    stations:[
      ["Station 1, Hafen Puno","Der Tag beginnt am Hauptkahnt am Ufer, wo die Boote der Verbände ablegen. Die ersten 20 Minuten fahren durch den Schilfgürtel hinaus Richtung offenes Wasser. Praktisch: Frühstücken Sie vorher, auf den Inseln gibt es nur wenig. Seekranke sitzen mittschiffs und halten den Blick an den Horizont. Am Morgen ist die Luft klar und kalt, aber die Sonne in dieser Höhe kostet schnell Sonnenbrand; Sonnencreme gehört auch auf bewölkte Tage.","Titicaca_Puno_Harbor.jpg"],
      ["Station 2, Uros-Inseln","Hier stehen Sie zum ersten Mal auf Boden, den niemand als Boden geplant hat: Der Schilfboden ist weich, gibt im Schritt nach, und aus dieser Eigenheit ergibt sich der Unterhalt: Ohne ständiges Nachlegen würde eine Insel in wenigen Jahren absinken. Ein Familienmitglied zeigt die Anlage, Das Boot verlässt nach gut einer Stunde Richtung Taquile. Zur Temperatur: Die Sonne trifft hier spitz, Schattigkeit und Windjacke gehören zusammen. Wer fotografieren möchte, kommt auf Rückweg am besten mit Blick über die offene Wasserfläche.","Uros_Floating_Islands.jpg"],
      ["Station 3, Überfahrt nach Taquile","Zwischen den Uros-Inseln und Taquile gehen gut zwei Stunden offenes Wasser, die meist mäßig bewegt sind. Das Tempo bestimmt das Wetter, welliges Wasser ist die Regel, keine Ausnahme. Nutzen Sie die Zeit fürs Lesen der Route: Links liegt die Halbinsel Capachica, rechts schließt sich die bolivianische Seite an, direkt um Taquile herum liegt Amantani weiter unten. Gegen Mittag kommt die Insel sichtbar: Sie sieht aus wie ein Terrassenhang über dem Wasser, am untersten Rand liegt ein kleiner Hafen.","Lake_Titicaca_Boat.jpg"],
      ["Station 4, Taquile","Der Aufstieg nimmt rund 40 Minuten über Stufen und Pfade, der Pfad ist schmal und gepflegt. Auf dem Hauptplatz erklärt ein Gemeinschaftsmitglied die Textilcodes: Was getragen wird, verrät etwas über Alter, Status und Zeitpunkt. Mittag gibt es bei einer Familie in einfachen Räumen: Suppe, Kartoffeln, Reis, Forelle vom See, danach kurze Erholung im Schatten. Der Rückweg führt über die andere Inselseite zum Hafen; dort steigt das Boot wieder Richtung Puno, Rückkehr gegen 17 Uhr.","Taquile_Island.jpg"]
    ],
    praktisch:["Eintritt und Beiträge: Auf den Uros legt jede Insel eine Familienabgabe fest, meist kleine Scheine; auf Taquile fällt eine Inselgebühr an, plus Mittag.","Bootspreise: Ganztagestour ab Puno ab etwa US$ 55, mit beiden Inseln, Mittag und Führung; Halbtagestouren nur Uros ab rund S/ 25 bis 40.","Start und Rückkehr: Abfahrt um 7 Uhr vom Hafen, Rückkehr etwa 17 Uhr; Peak-Season Juni bis August, früh buchen.","Höhe: 3.812 m am See, Taquile-Aufstieg auf rund 3.950 m: langsam gehen und Wasser mitnehmen.","Sonnen- und Wetterschutz: Auf dem Wasser ist der UV-Index streng, Windjacke und Hut sinnvoll, nachmittags kühlt es ab."],
    sources:["turismoliberty.pe: Uros Islands Tour from Puno 2026","de.wikipedia.org: Taquile","adondeviajar.mx: Titicaca Inseln 2026"]
