<style>
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root {
  --bg:#f6f4ef; --card:#ffffff; --card2:#efece3; --text:#26313d; --muted:#68737e;
  --akzent:#0e7c66; --akzent-soft:#e2f2ee; --akzent2:#e0a63c; --linie:#e3ded3;
  --ok:#2e9e5b; --ok-soft:#e6f5ec; --bad:#d64545; --bad-soft:#fbe9e9;
  --schatten:0 2px 10px rgba(30,40,50,.08);
}
html[data-theme="dunkel"] {
  --bg:#141a21; --card:#1e2630; --card2:#28323e; --text:#e8ecf1; --muted:#9aa5b1;
  --akzent:#3cc9a7; --akzent-soft:#1f332e; --akzent2:#e5b95c; --linie:#2e3947;
  --ok:#4dbd7e; --ok-soft:#203428; --bad:#e36a6a; --bad-soft:#3a2525;
  --schatten:0 2px 14px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --bg:#141a21; --card:#1e2630; --card2:#28323e; --text:#e8ecf1; --muted:#9aa5b1;
    --akzent:#3cc9a7; --akzent-soft:#1f332e; --akzent2:#e5b95c; --linie:#2e3947;
    --ok:#4dbd7e; --ok-soft:#203428; --bad:#e36a6a; --bad-soft:#3a2525;
    --schatten:0 2px 14px rgba(0,0,0,.45);
  }
}
body {
  margin:0; background:var(--bg); color:var(--text); line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  transition:background .3s, color .3s;
}
.topbar {
  position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:10px 14px; background:var(--card); border-bottom:1px solid var(--linie);
  box-shadow:var(--schatten);
}
.brand { font-weight:800; font-size:1.15rem; margin-right:auto; }
.brand .sub { display:block; font-size:.62rem; color:var(--muted); font-weight:500; }
.statistik { display:flex; gap:6px; flex-wrap:wrap; }
.chip { background:var(--card2); border:1px solid var(--linie); border-radius:999px; padding:4px 10px; font-size:.8rem; white-space:nowrap; }
nav.nav { display:flex; gap:6px; width:100%; flex-wrap:wrap; }
.btn, nav.nav button {
  font:inherit; cursor:pointer; border:1px solid var(--linie); background:var(--card);
  color:var(--text); border-radius:10px; padding:8px 12px; transition:transform .06s, background .2s;
}
.btn:active, nav.nav button:active { transform:scale(.97); }
.btn.primary { background:var(--akzent); color:#fff; border-color:var(--akzent); }
.btn.geist { background:transparent; }
.btn:disabled { opacity:.45; cursor:default; }
.btn:focus-visible, nav.nav button:focus-visible { outline:2px solid var(--akzent2); outline-offset:1px; }
nav.nav button.aktiv { background:var(--akzent); border-color:var(--akzent); color:#fff; }
main { max-width:960px; margin:0 auto; padding:18px 14px 90px; }
h2 { margin:20px 0 8px; font-size:1.1rem; }
h3 { margin:0 0 6px; }
.muted { color:var(--muted); }
.held { background:var(--card); border:1px solid var(--linie); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--schatten); }
.held .gross { font-size:1.4rem; font-weight:800; }
.gross { font-size:1.4rem; font-weight:800; }
.statistik-zeile { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.karten-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px; }
.mod-karte { text-align:left; background:var(--card); border:1px solid var(--linie); border-radius:14px; padding:12px; cursor:pointer; box-shadow:var(--schatten); font:inherit; color:var(--text); }
.mod-karte:hover:not(:disabled) { border-color:var(--akzent); }
.mod-karte.gesperrt { opacity:.55; cursor:default; }
.mod-karte .nr { font-size:.7rem; color:var(--muted); }
.fortschritt { height:8px; background:var(--card2); border-radius:99px; overflow:hidden; margin:8px 0 4px; }
.fortschritt > div { height:100%; background:var(--akzent); border-radius:99px; }
.abzeichen-regal { display:flex; flex-wrap:wrap; gap:8px; }
.abz { display:inline-flex; align-items:center; gap:5px; background:var(--card2); border:1px solid var(--linie); border-radius:999px; padding:5px 10px; font-size:.78rem; }
.wortliste { line-height:2.1; }
.wort { font:inherit; background:none; border:none; padding:3px 6px; margin:0; color:var(--akzent); text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; cursor:pointer; border-radius:6px; }
.wort:hover { background:var(--akzent-soft); }
.wort.gelernt { color:var(--muted); text-decoration:line-through; text-decoration-style:dotted; }
/* Lernstapel */
.stapel-wrap { max-width:620px; margin:0 auto; text-align:center; }
.karte-aussen { perspective:1400px; margin:14px 0; }
.karte { position:relative; min-height:270px; cursor:pointer; }
.karte-inner { position:relative; width:100%; min-height:270px; transition:transform .45s; transform-style:preserve-3d; }
.karte.gedreht .karte-inner { transform:rotateY(180deg); }
.karte-seite {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:22px 16px 28px; background:var(--card); border:1px solid var(--linie);
  border-radius:18px; box-shadow:var(--schatten);
}
.karte-seite.rueck { transform:rotateY(180deg); }
.karte-seite .begriff { font-size:1.6rem; font-weight:700; text-align:center; }
.hinweis-klein { color:var(--muted); font-size:.75rem; }
.stern { position:absolute; top:8px; right:12px; z-index:5; font-size:1.4rem; background:none; border:none; cursor:pointer; color:var(--muted); }
.stern.aktiv { color:var(--akzent2); }
.knopf-zeile { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:620px; margin:0 auto; }
.knopf-zeile .btn { font-size:1.1rem; padding:10px 4px; }
.aktion-zeile { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
.varianten-liste { display:flex; flex-direction:column; gap:5px; font-size:.92rem; align-items:center; }
/* Quiz & Optionen */
.frage-box { background:var(--card); border:1px solid var(--linie); border-radius:16px; padding:18px; box-shadow:var(--schatten); }
.begriff { font-size:1.5rem; font-weight:700; margin:8px 0; }
.optionen { display:grid; gap:8px; margin-top:14px; }
.option { text-align:left; padding:12px 14px; border-radius:12px; border:1px solid var(--linie); background:var(--card); cursor:pointer; font:inherit; color:var(--text); }
.option:hover:not(:disabled) { border-color:var(--akzent); }
.option.ok { background:var(--ok-soft); border-color:var(--ok); }
.option.schlecht { background:var(--bad-soft); border-color:var(--bad); }
.option:disabled { cursor:default; }
/* Baukasten */
.antwort-box { min-height:68px; border:2px dashed var(--linie); border-radius:14px; padding:10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.badges-pool { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.badge-wort { font:inherit; padding:8px 14px; border-radius:999px; border:1px solid var(--linie); background:var(--card2); cursor:pointer; color:var(--text); }
.badge-wort:hover { border-color:var(--akzent); }
.badge-wort.platziert { display:none; }
.badge-wort.ok { background:var(--ok-soft); border-color:var(--ok); }
.schutteln { animation:schutteln .4s; }
@keyframes schutteln { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
/* Dialoge */
.chat { display:flex; flex-direction:column; gap:10px; padding:4px 0; }
.bubble { max-width:86%; padding:10px 14px; border-radius:16px; background:var(--card); border:1px solid var(--linie); box-shadow:var(--schatten); cursor:pointer; }
.bubble.links { align-self:flex-start; border-bottom-left-radius:4px; animation:rein .25s; }
.bubble.rechts { align-self:flex-end; background:var(--akzent); border-color:var(--akzent); color:#fff; border-bottom-right-radius:4px; animation:rein .25s; }
.bubble .es { font-weight:600; }
.bubble .de { font-size:.8rem; opacity:.85; margin-top:3px; }
select { font:inherit; padding:8px 12px; border-radius:10px; border:1px solid var(--linie); background:var(--card); color:var(--text); max-width:100%; }
input[type="text"], input[type="search"] { font:inherit; padding:8px 12px; border-radius:10px; border:1px solid var(--linie); background:var(--card); color:var(--text); max-width:100%; }
.fav-zeile { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; border-bottom:1px solid var(--linie); padding:7px 0; }
.fav-zeile .es { font-weight:600; }
@keyframes rein { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
/* Modal, Party, Toast */
.modal { position:fixed; inset:0; background:rgba(10,15,20,.55); display:flex; align-items:center; justify-content:center; padding:18px; z-index:100; }
.modal[hidden] { display:none; }
.modal-panel { background:var(--card); border:1px solid var(--linie); border-radius:18px; padding:20px; max-width:440px; width:100%; box-shadow:var(--schatten); max-height:85vh; overflow:auto; }
.party { position:fixed; inset:0; background:rgba(10,15,20,.65); display:flex; align-items:center; justify-content:center; z-index:120; padding:18px; }
.party[hidden] { display:none; }
.party-box { background:var(--card); border:1px solid var(--linie); padding:28px; border-radius:20px; text-align:center; max-width:440px; width:100%; box-shadow:var(--schatten); animation:rein .45s; }
.konfetti { font-size:2.6rem; animation:huepfen .9s infinite alternate; }
@keyframes huepfen { from{transform:translateY(0)} to{transform:translateY(-14px)} }
@keyframes rein { from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1} }
#toast {
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--text); color:var(--bg);
  padding:10px 18px; border-radius:12px; opacity:0; pointer-events:none; transition:opacity .3s;
  z-index:200; max-width:90vw; text-align:center; font-size:.9rem;
}
#toast.sichtbar { opacity:.96; }
#toast.bad { background:var(--bad); color:#fff; }
@media (max-width:600px) {
  .topbar { padding:8px 10px; }
  .brand { width:100%; margin-right:0; }
  .karte-seite .begriff { font-size:1.3rem; }
  .begriff { font-size:1.2rem; }
}
</style>
</head>

<script>
'use strict';
/* ================== Kern: Konstanten, Stand, Speicher ================== */
var FLAGGEN = { MX:'🇲🇽', PE:'🇵🇪', PA:'🇵🇦', CR:'🇨🇷' };
var LANDNAMEN = { MX:'Mexiko', PE:'Peru', PA:'Panama', CR:'Costa Rica' };
var STD = {
  version: 1, punkte: 0, serie: 0, besteSerie: 0,
  streak: { a: 0, b: 0, d: null },
  bestanden: {}, gelernt: {}, favoriten: [], abzeichen: [], quiz: {},
  modus: 'auto', stumm: false, richtung: 'mix', bkf: { s: 'alle', z: 'alle' }
};
function frischerStand() { return JSON.parse(JSON.stringify(STD)); }
var S = frischerStand();
try {
  var roh = localStorage.getItem('vamos_state');
  if (roh) {
    var g = JSON.parse(roh);
    S = Object.assign(frischerStand(), g);
    if (!S.streak) S.streak = frischerStand().streak;
  }
} catch (e) { console.warn('Speicher nicht verfügbar (Vorschau-Modus):', e); }
function speichern() {
  try { localStorage.setItem('vamos_state', JSON.stringify(S)); } catch (e) {}
}
function mische(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function fmtDatum(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function heute() { return fmtDatum(new Date()); }
function plusTage(n) { var d = new Date(); d.setDate(d.getDate() + n); return fmtDatum(d); }
function $(sel) { return document.querySelector(sel); }
function esc(t) {
  return String(t).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function haupt() { return document.getElementById('haupt'); }
/* Such-Normalisierung: akzent-/zeichensymbol-unempfindlich (¿qué tal? → que tal) */
function normiere(t) {
  return String(t).toLowerCase()
    .replace(/á/g, 'a').replace(/é/g, 'e').replace(/í/g, 'i')
    .replace(/ó/g, 'o').replace(/ú/g, 'u').replace(/ü/g, 'u').replace(/ñ/g, 'n')
    .replace(/[¿?¡!.,;:()']/g, '');
}

/* ================== Sprachausgabe (immer die richtige Lösung) ================== */
/* sprich(text) – spricht. sprich(text, dann) – spricht und ruft dann() auf,
   sobald die Ausgabe fertig ist (oder nach Ausfall-Pause). */
function sprich(text, dann) {
  var weiter = function () { if (dann) { try { dann(); } catch (e) {} } };
  if (S.stumm || !('speechSynthesis' in window)) {
    if (dann) setTimeout(weiter, 1300);
    return;
  }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var stimmen = speechSynthesis.getVoices() || [];
    var v = null;
    for (var i = 0; i < stimmen.length; i++) {
      if (/^es[-_]419/i.test(stimmen[i].lang)) { v = stimmen[i]; break; }
    }
    if (!v) {
      for (var k = 0; k < stimmen.length; k++) {
        if (/^es[-_](MX|US|CO|PE|AR)/i.test(stimmen[k].lang)) { v = stimmen[k]; break; }
      }
    }
    if (!v) {
      for (var m = 0; m < stimmen.length; m++) {
        if (/^es/i.test(stimmen[m].lang)) { v = stimmen[m]; break; }
      }
    }
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-ES'; }
    u.rate = 0.92;
    var fertig = false;
    var einmal = function () { if (!fertig) { fertig = true; weiter(); } };
    if (dann) {
      u.onend = einmal;
      u.onerror = einmal;
      /* Sicherheitsnetz, falls onend nie feuert */
      setTimeout(einmal, 2600 + text.length * 95);
    }
    speechSynthesis.speak(u);
  } catch (e) { weiter(); }
}
if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); } catch (e) {} }

/* ================== Design (auto / hell / dunkel) ================== */
function modusAnwenden() {
  document.documentElement.setAttribute('data-theme', S.modus);
  var b = $('#btnTheme');
  if (b) b.textContent = S.modus === 'auto' ? '🌗' : (S.modus === 'hell' ? '☀️' : '🌙');
}
function modusWechseln() {
  S.modus = S.modus === 'auto' ? 'hell' : (S.modus === 'hell' ? 'dunkel' : 'auto');
  modusAnwenden(); speichern();
  toast('Design: ' + (S.modus === 'auto' ? 'Automatisch (Gerät)' : (S.modus === 'hell' ? 'Hell' : 'Dunkel')));
}

/* ================== Toast ================== */
var toastTimer = null;
function toast(text, typ) {
  var el = $('#toast');
  el.textContent = text;
  el.className = 'sichtbar' + (typ === 'bad' ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = ''; }, 2800);
}

  if (S.streak.d === h) return;
  var gestern = fmtDatum(new Date(Date.now() - 86400000));
  if (S.streak.d === gestern) {

  } else {
    if (S.streak.d) toast('😵 Streak zurückgesetzt – heute startet eine neue Serie!', 'bad');

}

function download(name, text) {

      ev.preventDefault();
      var sf = $('#stapelStern');
      if (S.favoriten.indexOf(k.w.id) < 0) {
        favoritUmschalten(k.w.id);
        if (sf) { sf.textContent = '⭐'; sf.classList.add('aktiv'); }
      }
    }
    else if (ev.key === '-' || ev.key === '_') {
      ev.preventDefault();
      var sf2 = $('#stapelStern');
      if (S.favoriten.indexOf(k.w.id) >= 0) {
        favoritUmschalten(k.w.id);
        if (sf2) { sf2.textContent = '☆'; sf2.classList.remove('aktiv'); }
      }
    }
  });
  /* Import: Datei einlesen */
  $('#importDatei').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var obj = JSON.parse(r.result);
        var stand = obj && obj.stand ? obj.stand : obj;
        if (!stand || typeof stand !== 'object') throw new Error('kein Objekt');
        S = Object.assign(frischerStand(), stand);
        if (!S.streak) S.streak = frischerStand().streak;
        speichern(); kopf(); modusAnwenden();
        $('#btnTts').textContent = S.stumm ? '🔇' : '🔊';
        toast('✅ Lernstand eingespielt – willkommen zurück!');
        zeige('start');
      } catch (e) {
        toast('❌ Datei konnte nicht gelesen werden.', 'bad');
      }
    };
    r.readAsText(f);
    ev.target.value = '';
  });
  /* Party schließen */
  $('#party').addEventListener('click', function (ev) {
    if (ev.target === this) { this.hidden = true; }
  });
  /* Start */
  modusAnwenden();
  kopf();
  $('#btnTts').textContent = S.stumm ? '🔇' : '🔊';
  pruefeAbzeichen();
  zeige('start');
  var heuteStr = heute();
  if (S.streak.d && S.streak.d !== heuteStr) {
    var gestern = fmtDatum(new Date(Date.now() - 86400000));
    if (S.streak.d !== gestern) {
      setTimeout(function () { toast('Du hast gestern verpasst – dein Streak wartet auf einen Neustart! 🔥', 'bad'); }, 800);
    }
  }
  window.onerror = function (msg) { toast('Fehler: ' + msg, 'bad'); return false; };
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
